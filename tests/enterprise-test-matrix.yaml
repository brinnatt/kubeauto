# ---------------------------------------------------------------------------
# 执行计划 (按组推进)
# ---------------------------------------------------------------------------
execution_groups:
  G1:
    name: "CLI 冒烟"
    priority: P0
    effort: low
    next: "补 zsh completion; download 增量"

  G2:
    name: "集群创建/销毁"
    priority: P0
    effort: medium
    next: "无阻塞项"

  G3:
    name: "集群运维"
    priority: P0
    effort: medium
    next: "restore 全集群回归(已完成 debian150)"

  G4:
    name: "节点扩缩"
    priority: P0
    effort: high
    next: "142 干净节点 full add/del 链路"

  G5:
    name: "身份与工具"
    priority: P1
    effort: low
    next: "kcfg-adm --expired 用例"

  G6:
    name: "交叉场景"
    priority: P0
    effort: high
    next: "无阻塞项"

  G7:
    name: "二级-网络插件"
    priority: P1
    effort: high
    next: "iptables proxy_mode; 节点 CNI 残留预检"

  G8:
    name: "二级-拓扑/addon"
    priority: P2
    effort: high
    next: "Debian OS 模板固化; ansible 2.17 依赖文档"

