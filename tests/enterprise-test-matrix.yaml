# kubeauto 企业级测试矩阵
# 用法: 按 group 顺序执行；每项 status: pending|pass|fail|skip|partial|na
# 环境: 跳板机 147(Ubuntu) + Rocky 130-132,140-142
# 默认栈: K8s 1.33 + containerd + calico + ipvs (当前发布基线)

meta:
  version: 1
  updated: "2026-07-07"
  baseline:
    k8s: "1.33.6"
    runtime: containerd
    network: calico
    proxy_mode: ipvs
    os_primary: "Rocky 8.10"
    os_secondary: "Ubuntu 22.04"

# ---------------------------------------------------------------------------
# 一级功能: kubecli 命令
# ---------------------------------------------------------------------------
tier1_commands:
  # --- G1: CLI 冒烟 (只读/无副作用) ---
  - id: T1-G1-01
    group: G1
    command: version
    desc: 显示版本号
    status: pass
    notes: "v0.1.4"

  - id: T1-G1-02
    group: G1
    command: list
    desc: 列出管理的集群
    status: pass

  - id: T1-G1-03
    group: G1
    command: completion
    desc: bash/zsh 补全脚本输出
    status: pass
    notes: "bash/zsh 均正常"

  - id: T1-G1-04
    group: G1
    command: checkout
    desc: 切换 ~/.kube/config 到指定集群
    status: pass
    cluster: test130

  - id: T1-G1-05
    group: G1
    command: download
    desc: 组件下载 (-D / 分组件)
    status: pass
    notes: "registry 本地可用; k8s bin 支持 dl.k8s.io 直链手动分发(v1.33.7); -E 外网 pull 受防火墙限制"

  # --- G2: 集群生命周期 (单节点 Rocky) ---
  - id: T1-G2-01
    group: G2
    command: new + setup
    desc: 新建集群 + setup all
    status: pass
    cluster: test141
    os: Rocky

  - id: T1-G2-02
    group: G2
    command: start-aio
    desc: 本机一键 AIO (Ubuntu/Debian)
    status: pass
    cluster: aio
    os: Ubuntu
    cross: [backup, stop, start, restore, idempotent-retry]

  - id: T1-G2-03
    group: G2
    command: destroy
    desc: 销毁集群并清理目录
    status: pass
    cluster: test130
    notes: "曾验证; destroy 会删 cluster dir"

  - id: T1-G2-04
    group: G2
    command: setup
    desc: 分步 setup (01-07, 10, 11)
    status: pass
    cluster: test141
    notes: "2026-07-05 幂等回归 01-06+07 通过"

  # --- G3: 集群运维 ---
  - id: T1-G3-01
    group: G3
    command: start
    status: pass
    clusters: [test130, test141, test-ha, aio]

  - id: T1-G3-02
    group: G3
    command: stop
    status: pass
    clusters: [test130, test141, test-ha, aio]

  - id: T1-G3-03
    group: G3
    command: backup
    status: pass
    clusters: [test130, test141, test-ha, aio]

  - id: T1-G3-04
    group: G3
    command: restore
    status: pass
    clusters: [test130, test141, test-ha, aio, debian150]
    notes: "debian150 升级后 restore 回归 pass"

  - id: T1-G3-05
    group: G3
    command: upgrade
    status: pass
    cluster: debian150
    notes: "v1.33.6→v1.33.7 跨小版本; kube-bin 从 dl.k8s.io 直链下载; backup+upgrade+restore 全链路"

  - id: T1-G3-06
    group: G3
    command: kca-renew
    status: pass
    clusters: [test130, test141, test-ha, aio]
    notes: "aio Ubuntu kca-renew 2026-07-05 pass"

  # --- G4: 节点扩缩 ---
  - id: T1-G4-01
    group: G4
    command: add-node
    status: pass
    notes: "131 在 test130/test-ha 交叉测过"

  - id: T1-G4-02
    group: G4
    command: del-node
    status: pass

  - id: T1-G4-03
    group: G4
    command: add-master
    status: pass
    cluster: test-ha
    notes: "142 add-master 测过; 需 clean 节点前置"

  - id: T1-G4-04
    group: G4
    command: del-master
    status: pass
    notes: "inventory kube_node 同步已修; del-master 后需 del-etcd 提示"

  - id: T1-G4-05
    group: G4
    command: add-etcd
    status: pass
    cluster: test-ha

  - id: T1-G4-06
    group: G4
    command: del-etcd
    status: pass
    cluster: test-ha

  # --- G5: 身份与工具 ---
  - id: T1-G5-01
    group: G5
    command: kcfg-adm
    desc: add / list / delete 自定义 kubeconfig 用户
    status: pass
    notes: "修复 CRB kubectl 无 KUBECONFIG、-L 过滤 bug; admin/view 权限验证"

  - id: T1-G5-02
    group: G5
    command: docker
    desc: 容器代理/镜像管理 CLI
    status: pass
    notes: "非 root sudo 写 proxy; -e 清理; registry 重启验证"

  - id: T1-G5-03
    group: G5
    command: system
    desc: SSH 免密/系统环境初始化
    status: pass
    notes: "本地 -b/-c/-d; 远程 SSH 探针 141(Rocky)/150(Debian); -a 免密已验"

# ---------------------------------------------------------------------------
# 一级交叉场景 (企业常见)
# ---------------------------------------------------------------------------
tier1_cross_scenarios:
  - id: X-G6-01
    group: G6
    scenario: destroy → new → setup all → kca-renew
    status: pass
    cluster: test130

  - id: X-G6-02
    group: G6
    scenario: setup → backup → stop → start → restore
    status: pass
    clusters: [test130, test141, test-ha, aio]

  - id: X-G6-03
    group: G6
    scenario: kca-renew → backup → restore
    status: pass
    notes: "141/ha/aio 测过; aio 2026-07-05 回归 pass"

  - id: X-G6-04
    group: G6
    scenario: add-node → 业务验证 → del-node → 同 IP 加入另一集群
    status: pass
    notes: "131 test130→test-ha add-master 全链路; 需清理 CNI/kube-router 残留"

  - id: X-G6-05
    group: G6
    scenario: add-master → backup → restore → del-master → del-etcd
    status: pass
    cluster: test-ha
    notes: "2026-07-06 master-131 全链路; 131 非 etcd 成员无需 del-etcd"

  - id: X-G6-06
    group: G6
    scenario: 多集群并行 kubecli (checkout/backup 切换)
    status: pass
    notes: "3 集群并行 backup 4s vs 串行 8s; checkout 切换 test141/debian150"

  - id: X-G6-07
    group: G6
    scenario: 非 TTY / CI 管道执行 (confirm_action)
    status: pass

  - id: X-G6-08
    group: G6
    scenario: start-aio 失败自动 revert
    status: pass
    notes: "注入 etcd 权限失败→taskflow revert→99.clean.yml 清理; aio 已恢复"

