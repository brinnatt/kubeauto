# kubeauto 企业级测试矩阵
# 用法: 按 group 顺序执行；每项 status: pending|pass|fail|skip|partial|na
# 环境: 跳板机 147(Ubuntu) + Rocky 130-133,140-142 + Debian 151
# 默认栈: K8s 1.33 + containerd + calico + ipvs (当前发布基线)

meta:
  version: 1
  updated: "2026-07-09"
  regression: "2026-07-09 full (phase1 G1/G2 + phase2 G3/G4/X-G6-01 + phase3 Tier2/G4-etcd/G5/X-G6-08/download)"
  baseline:
    k8s: "1.33.7"
    runtime: containerd
    network: calico
    proxy_mode: ipvs
    os_primary: "Rocky 8.10"
    os_secondary: "Ubuntu 22.04"

