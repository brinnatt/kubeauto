# kubeauto 企业级测试矩阵 v3 — brinnatt/talkedu 镜像统一 + 全量回归
# 执行: bash tests/run_enterprise_regression.sh
# Ubuntu aio 全量: sudo bash tests/helpers/regression-full.sh
# 补跑: sudo bash tests/helpers/regression-remainder.sh
# 130 jumper: kubecli setup k8s-dev 90
# 镜像过渡期: tests/helpers/bootstrap-brinnatt-mirrors.sh（CI 双推完成后可省略）

meta:
  version: 3
  updated: "2026-07-29"
  environment_updated: "2026-07-25"
  runner: tests/run_enterprise_regression.sh
  regression_log: /tmp/kubeauto-gaps-live.log
  regression_result: "PASS - DELIVERY_GAPS_FULLCHAIN_PASS; durable rc=0; 38 pass markers, 0 failure markers; post-run LAB_CLEAN_VERIFY_PASS"
  baseline:
    k8s: "1.33.6"
    runtime: containerd
    network: calico
    proxy_mode: ipvs
    os_primary: "Rocky 8.10"
    os_secondary: "Ubuntu 22.04 / Debian trixie"
  image_policy: |
    所有业务镜像统一 brinnatt/<name>:<tag>；
    拉取顺序 hub.talkedu.cn/kubeauto/<name> → Docker Hub brinnatt/<name>；
    部署路径 registry.talkschool.cn:5000/brinnatt/<name>；
    打包仓 kubeauto-ext-images-dockerfile CI 双推。
  notes: |
    Cilium operator repository 不含 -generic（避免 chart cloud=generic 双重后缀）。
    OpenEBS localpv 镜像 pin 4.3.0（umbrella 4.3.2 上游无 :4.3.2）。
    Addon 冒烟在 aio（与 local registry 同机），避免节点 /etc/hosts 指向错误 REGISTRY_HOST_IP。
    Tier3 tools 二进制未装在控制节点 → SKIP（非镜像迁移范围）。
    2026-07-19：SYS_RESERVED_ENABLED=yes 仍计入 Allocatable；SYS_RESERVED_ENFORCE 默认 no
    （官方 docs 警告 hard-limit system.slice 会饿死 apiserver/etcd；aio 实测 MemoryMax=1000Mi 导致 6443 reset）。
    helm dashboard/prometheus/minio 统一注入 KUBECONFIG（修复 localhost:8080）。
    2026-07-22：local registry start 后等待 GET /v2/ 就绪（同 Docker daemon wait），修 download -D EOF 时序。
    六仓严禁局部分裂：test_six_repo_version_sync 对账 constants↔ext-images CI↔component_images。

environments:
  development:
    - id: ENV-129
      host: 192.168.47.129
      os: development workstation
      role: PyCharm + VS Code + Codex source development only
      participates_in_regression: false
      sync_targets: [ENV-138, ENV-130]
  control:
    - id: ENV-138
      host: 192.168.47.138
      os: Ubuntu 22.04
      user: ubuntu
      become: true
      role: all-in-one 主回归控制节点 (ansible 2.17, source kubecli)
    - id: ENV-130
      host: 192.168.47.130
      os: Rocky 8.10
      user: root
      role: jumper（ansible 2.16, python3.12 source kubecli）
  nodes:
    workers:
      ips: [131-133]
      user: root
      os: Rocky 8.10
      role: worker pool
    masters:
      ips: [134-136]
      user: root
      os: Rocky 8.10
      role: master pool
    reserved:
      ips: [137]
      user: root
      os: Rocky 8.10
      role: 8 CPU / 32 GiB system and kube reserved gate
    debian:
      ips: [128]
      user: brinnatt
      become: true
      role: Debian trixie cluster node
  scenario_hosts:
    reserved_gate: {host: 192.168.47.137, purpose: 2CPU+4Gi reserved contract}
    docker_gate: {host: 192.168.47.137, purpose: docker plus cri-dockerd and 2CPU+4Gi reserved contract}
    nfs_server: {host: 192.168.47.133, purpose: NFS provisioner smoke}
    external_lb: {vip: 192.168.47.250, port: 8443}
  access:
    credential_source: runtime arguments or LAB_SSH_PASSWORD; do not store passwords in matrix
    control_users: {ENV-138: ubuntu, ENV-130: root}
    node_users: {workers: root, masters: root, reserved: root, debian: brinnatt}
  topology_note: |
    This is the current laboratory authority supplied by the delivery owner:
    development=129; jumper=130; workers=131-133; masters=134-136;
    Debian=128; reserved=137; Ubuntu all-in-one control=138.
    No retired address outside this topology is a valid test target.

