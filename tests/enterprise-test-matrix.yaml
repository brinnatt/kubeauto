# ---------------------------------------------------------------------------
# 执行计划 (按组推进)
# ---------------------------------------------------------------------------
execution_groups:
  G1:
    name: "CLI 冒烟"
    priority: P0
    effort: low
    next: "补 zsh completion; download 增量"

  G2:
    name: "集群创建/销毁"
    priority: P0
    effort: medium
    next: "setup 10/11 ex-lb/harbor; new 集群模板回归"

  G3:
    name: "集群运维"
    priority: P0
    effort: medium
    next: "upgrade 跨版本(需第二套 k8s bin); restore 全集群回归"

  G4:
    name: "节点扩缩"
    priority: P0
    effort: high
    next: "142 干净节点 full add/del 链路"

  G5:
    name: "身份与工具"
    priority: P1
    effort: low
    next: "system 远程探针; kcfg-adm --expired 用例"

  G6:
    name: "交叉场景"
    priority: P0
    effort: high
    next: "并行 ansible 压测; start-aio revert 注入失败"

  G7:
    name: "二级-网络插件"
    priority: P1
    effort: high
    next: "iptables proxy_mode; 节点 CNI 残留预检"

  G8:
    name: "二级-拓扑/addon"
    priority: P2
    effort: high
    next: "ex_lb, harbor, dedicated etcd"

coverage_summary:
  tier1_total: 28
  tier1_pass: 20
  tier1_partial: 2
  tier1_pending: 4
  tier1_na: 1
  tier1_cross_total: 8
  tier1_cross_pass: 4
  tier1_cross_partial: 4
  tier2_total: 18
  tier2_pass: 14
  tier2_pending: 3
  tier2_na: 1
  overall_assessment: |
    基线栈 (Rocky+containerd+calico) 核心路径已覆盖约 75%。
    五类 CNI 单节点均已测通; G5/G6 主要交叉场景完成。
    距企业级全功能覆盖差距主要在: upgrade 跨版本、iptables proxy、
    ex_lb/harbor/dedicated-etcd 拓扑、ingress/prometheus addon。
