  - {id: TL-NET-02, tool: NetCheckCli, category: cli, scenario: "版本、帮助、非法参数退出合同", command: "python3 tools/NetCheckCli.py --help; python3 tools/NetCheckCli.py --version", expected: "帮助/版本可显示；非法目标返回非 0 且无子进程", status: pass, evidence: "2026-09-12 人工生产签署：NetCheckCli 已多年稳定生产运行；按用户明确指令免专项回归，保留该项 PASS 作为生产验证结论"}
