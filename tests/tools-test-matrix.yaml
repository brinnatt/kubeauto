# tools 独立交付测试矩阵 v1（评审稿）
# 本文件只描述 tools/，不继承 enterprise/middleware 矩阵的状态或证据。

meta:
  version: 1
  updated: "2026-09-24"
  status: approved
  runner: tests/run_tools_regression.sh
  scope: "tools/ 下每个脚本都是独立 CLI；禁止依赖 kubeauto 核心、middleware、其它 tools 或其它工程。"
  review_gate: "矩阵已经用户批准；任何新增或变更场景须先回到 pending，并在静态梯级通过后才能启动 live lab。"
  acceptance: "当前证据、durable rc=0、零 failure marker、成功标记、构建 SHA256/来源、TOOLS_CLEAN_VERIFY_PASS。"
  static_commands:
    - "python3 tests/helpers/validate_tools_test_matrix.py tests/tools-test-matrix.yaml"
    - "python3 -m compileall -q tools"
    - "python3 -m unittest discover -s tests/unit -p 'test_tools_*.py'"
  live_prerequisites:
    - "评审批准本矩阵及 fixture/凭据边界"
    - "clean lab wipe + verify"
    - "固定版本依赖与官方来源可审计（镜像/包 checksum 或 manifest digest）"
    - "fixture 必须使用矩阵登记的既有固定制品；MyLogiBackupCli 本轮直接消费 TalkEdu Hub 已发布 digest，不触发 ext-images 或 GitHub Actions"
    - "现场优先使用 hub.talkedu.cn；无动态镜像发现、无重复公网下载，公网不可用时正常测试路径仍可执行"
  artifact_prerequisites:
    owner_repository: "kubeauto-ext-images-dockerfile"
    publication: "GitHub Actions dual-push"
    primary_registry: "hub.talkedu.cn/kubeauto"
    fallback_registry: "Docker Hub brinnatt"
    required_evidence: ["official source", "exact version", "manifest digest or SHA256", "owner", "cleanup scope"]
    mysql_tools:
      migration:
        - "hub.talkedu.cn/kubeauto/mysql:8.0.46@sha256:0b6938c55ad3ef982d41cfa3ee01a63074cd5c9f3907487badeda53f6feb14da"
        - "hub.talkedu.cn/kubeauto/mysql-8.4:8.4.4@sha256:0a3e659b9fb960330299e2a1847414f6185c573a3fd2cf1320221066904ea77d"
        - "hub.talkedu.cn/kubeauto/mysql-9.2:9.2.0@sha256:867954f8c74131e891c2d3501560abbb7548ab8f439245c2feb4648f99b0caeb"
      physical_backup:
        - "hub.talkedu.cn/kubeauto/mysql-8.4@sha256:c26ba5d7363cdae3f0a31665b2ab9106397324dde56ed536364776901b924b83"
        - "hub.talkedu.cn/kubeauto/percona-xtrabackup@sha256:6f3f3735320eb77e7bb00300b37efd9a0cc797c34e2c637a2f687c77504d94b5"
      logical_backup:
        owner: "TalkEdu Hub existing published artifacts"
        publication: "pre-existing; no GitHub Actions or ext-images mutation in this delivery"
        cleanup_scope: "131-134 上 mylogi-* 容器、/data/kubeauto-tools/mylogi-backup-* 和 durable state"
        images:
          - "hub.talkedu.cn/kubeauto/mysql@sha256:2f27838ce14a31d6e434efb442658c4ce19a7cd0ec834e329ca213569faa7d3c"
          - "hub.talkedu.cn/kubeauto/mysql-8.4@sha256:c26ba5d7363cdae3f0a31665b2ab9106397324dde56ed536364776901b924b83"
          - "hub.talkedu.cn/kubeauto/mysql-9.2@sha256:308515a860be3b21aa44ced3d39f7f91d800efe7ff3719c249f19a89a8480740"
      packaging: ["pinned minimal Rocky Linux fixture image"]
    cross_runtime:
      host: "root@192.168.47.131"
      images:
        - "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian@sha256:9df39a1d5bfac0249f0eef61a3ff74fcf7576c5947f23127c57e92267ad98ced"
        - "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/ubuntu@sha256:b0c08a4b639b5fca9aa4943ecec614fe241a0cebd1a7b460093ccaeae70df698"
      cleanup_scope: "131 上 kubeauto-tools-cross-* 容器、/tmp/kubeauto-tools-cross-* 和 durable state"
    tool_fixtures:
      busybox: "hub.talkedu.cn/kubeauto/busybox@sha256:3e0b302381acd9c4092a89b51ccc8727534f044b2b3db17f55575e27f62ec6cc"
      kube_publish: "hub.talkedu.cn/kubeauto/pause@sha256:1d048b53f4285cc9d20fbb8d7be785c50e9e4ccf4cf1194d9b176001862d900a"
  official_sources:
    python_subprocess: "https://docs.python.org/3/library/subprocess.html"
    pyinstaller: "https://pyinstaller.org/en/stable/operating-mode.html"
    openvpn_easyrsa: "https://github.com/OpenVPN/easy-rsa/tree/v3.0.7"
    calico: "https://docs.tigera.io/calico/latest/reference/resources/globalnetworkpolicy"
    kubernetes_api: "https://kubernetes.io/docs/reference/using-api/api-concepts/"
    docker_save_load: "https://docs.docker.com/engine/reference/commandline/save/"
    nerdctl: "https://github.com/containerd/nerdctl/blob/main/docs/README.md"
    kafka: "https://kafka.apache.org/43/documentation.html"
    kafka_source: "https://github.com/apache/kafka/tree/4.3.1"
    strimzi_kafka_source: "https://github.com/strimzi/strimzi-kafka-operator/tree/1.2.0"
    mysql: "https://dev.mysql.com/doc/refman/8.4/en/"
    percona_xtrabackup: "https://docs.percona.com/percona-xtrabackup/8.4/"
    starrocks: "https://docs.starrocks.io/"

tool_catalog:
  NetCheckCli: {path: tools/NetCheckCli.py, entrypoint: "python3 tools/NetCheckCli.py", official: [python_subprocess]}
  OvpnUserCli: {path: tools/OvpnUserCli.py, entrypoint: "python3 tools/OvpnUserCli.py", official: [openvpn_easyrsa]}
  CalicoPolicyCli: {path: tools/k8stools/CalicoPolicyCli.py, entrypoint: "python3 tools/k8stools/CalicoPolicyCli.py", official: [calico, kubernetes_api]}
  KubeBackupCli: {path: tools/k8stools/KubeBackupCli.py, entrypoint: "python3 tools/k8stools/KubeBackupCli.py", official: [kubernetes_api]}
  KubePublishCli: {path: tools/k8stools/KubePublishCli.py, entrypoint: "python3 tools/k8stools/KubePublishCli.py", official: [docker_save_load, nerdctl, pyinstaller]}
  KafkaCli: {path: tools/kafka/KafkaCli.py, entrypoint: "python3 tools/kafka/KafkaCli.py", official: [kafka, kafka_source, strimzi_kafka_source, pyinstaller]}
  MigrationCli: {path: tools/mysqltools/MigrationCli.py, entrypoint: "python3 tools/mysqltools/MigrationCli.py", official: [mysql]}
  MyBackupCli: {path: tools/mysqltools/MyBackupCli.py, entrypoint: "python3 tools/mysqltools/MyBackupCli.py", official: [percona_xtrabackup, mysql]}
  MyLogiBackupCli: {path: tools/mysqltools/MyLogiBackupCli.py, entrypoint: "python3 tools/mysqltools/MyLogiBackupCli.py", official: [mysql, pyinstaller]}
  StarCli: {path: tools/starrocks/StarCli.py, entrypoint: "python3 tools/starrocks/StarCli.py", official: [starrocks, pyinstaller]}

test_cases:
