# 每行描述产品实际执行边界；container 表示相同CLI在准备好依赖的工具容器中运行，
# 不推定目标server镜像自带工具，也不将API可达等同于本地数据目录可见。
execution_boundaries:
  NetCheckCli:
    configuration: "CLI目标、报告目录、探测时长/阈值；环境中的线程/展开上限"
    namespace: "执行端网络命名空间；宿主机与容器的ICMP权限、DNS和路由分别成立"
    identity: "输入目标白名单/格式校验；不管理数据库或服务"
    commands: "run_ping argv → ping；TCP socket；质量汇总与退出码"
    paths: "report_dir/json_summary/log_file均为执行端路径"
    cleanup: "信号通知工作线程退出；只写本次报告和日志，不删用户数据"
    evidence_scope: "原用户生产签署保持原身份；新增审计不声称容器网络专项现场PASS"
  OvpnUserCli:
    configuration: "GENOVPN_*路径、server.conf的proto/dev/TLS密钥及方向、create/revoke/status"
    namespace: "执行端PKI与OpenSSL；容器须显式挂载真实PKI和server.conf"
    identity: "Easy-RSA3.0.7目录/CA与CN；tls-crypt-v2签发前拒绝"
    commands: "真实easyrsa build-client-full/revoke/gen-crl；openssl证书/CRL核验"
    paths: "TLS绝对路径或显式绝对cd；不猜启动cwd，不分发server unwrap key"
    cleanup: "拒绝时不变更PKI/旧包；吊销后删除所属用户包，按serial保留撤销历史"
    evidence_scope: "TL-OVPN-03/06；OpenSSL1.1.1隔离PKI；不签VPN握手/OpenSSL3"
  CalicoPolicyCli:
    configuration: "context、executor、流量层、namespace、策略名、HEP/GNP参数"
    namespace: "执行端kubectl/calicoctl kubeconfig；API对象属于显式目标集群"
    identity: "context/资源名/标签选择器；host/pod/both分别检查"
    commands: "apply/delete/get执行器；首错非0且停止后续变更；空集合与枚举失败区分"
    paths: "备份与日志为执行端路径；容器不能隐式继承宿主机kubeconfig"
    cleanup: "只回收本轮命名策略/HEP/namespace；不得删除外来网络策略"
    evidence_scope: "TL-CAL-09当前真实API双执行器/三流量层删除、故障停止及重试通过"
  KubeBackupCli:
    configuration: "kubeconfig/context、namespace、resources、selector、output/input目录与restore改写"
    namespace: "执行端Kubernetes Python客户端→指定API；不要求数据库文件挂载"
    identity: "显式context优先于in-cluster/current-context；未知context连接前拒绝"
    commands: "动态discovery/list/create/patch；备份归档及恢复清单"
    paths: "kubeconfig、tar及目录为执行端路径；配置和凭据不因容器默认值切换实例"
    cleanup: "仅所属namespace/CRD夹具；归档路径穿越与失败返回非0"
    evidence_scope: "TL-KB-03/04当前双API、六类资源及CRD/CR完整恢复、安全拒绝与重试通过"
  KubePublishCli:
    configuration: "CLI/JSON镜像、目标host:port、runtime、namespace、tar/output路径"
    namespace: "执行端Docker与远端runtime分别命名；容器需要真实daemon/socket权限"
    identity: "镜像digest/ID、目标SSH身份、nerdctl namespace"
    commands: "pull/save→SSH传输→load；逐包load首个非0传播；delete显式确认"
    paths: "本地归档与远端本次临时目录分开；用户提供tar不作为自动清理对象"
    cleanup: "成功/失败均仅回收本次生成tar/远端会话目录，保留用户文件"
    evidence_scope: "TL-KP-03/05当前source/frozen × Docker/nerdctl真实SSH首错、重试ID及限定清理通过"
  KafkaCli:
    configuration: "CLI/JSON→_get_opt；kafka_home、角色/端点、存储身份、SSH与认证"
    namespace: "本地服务部署或远端SSH bootstrap；冻结产物直接执行，源码用Python"
    identity: "cluster.id、node.id、controller/broker职责、目标主机与监听/advertised端点"
    commands: "Kafka4.3.1官方脚本与JVM；远端上传校验和路径quote"
    paths: "kafka_home/log_dirs/metadata_log_dir属于实际执行节点；不可借用调用端同名路径"
    cleanup: "仅工具所属服务/进程/会话文件；不把远端参数拒绝称为broker业务PASS"
    evidence_scope: "TL-KAF-06当前真实SSH交接；原业务证据仅签其原边界"
  MigrationCli:
    configuration: "source/target、全局/任务/CLI选项→连接与dump/import"
    namespace: "PyMySQL与原生mysql/mysqldump均为TCP；localhost指定端口不能落到默认socket"
    identity: "源目标host/port/schema、版本升级策略；默认参数文件隔离"
    commands: "driver预检→mysqldump argv→mysql argv→校验/审计；子进程首错传播"
    paths: "临时cnf/dump/report属于执行端；工具容器的localhost指其自身网络空间"
    cleanup: "临时凭据/dump/子进程；rollback只允许删除本次专用目标"
    evidence_scope: "TL-MIG-03当前native及完整迁移、读回/回滚/重试/并发隔离通过"
  MyBackupCli:
    configuration: "mysql_datadir/binlog_dir/binlog_index/socket/container/service/topology/defaults_file；压缩/线程/内存/DDL锁；配置注释说明默认、空值和执行者"
    namespace: "二进制实例宿主机、容器实例宿主机或独立工具容器；native路径与SQL一致，容器路径由真实bind mount核对"
    identity: "SQL实例UUID/版本/GTID/通道；Docker64hex容器ID及映射或真实systemd unit；systemd不代管容器；copy-back保留目标UUID及持久变量"
    commands: "full/incr显式路径与复制安全坐标→工作副本解压/prepare→真实停库/copy-back/SQL就绪→隔离PITR；native已停机入口核验真实mysqld/defaults文件，不自动重接复制"
    paths: "data/logs/tmp分挂；index写回server可见路径；数字UID/GID保留"
    cleanup: "raw备份不可消耗；copy-back失败回滚原目录/外置binlog；新历史须新full"
    evidence_scope: "TL-MBK-07/08双系统双版本host/container×GTID及09容器最终；10/11/12二进制单机/主从/异步双主×双系统双版本GTID OFF/ON及13二进制最终；父项pending不能外推PASS"
  MyLogiBackupCli:
    configuration: "login-path中的显式IPv4/port、库选择、挂载目录、压缩、timer与native options"
    namespace: "执行端TCP客户端；备份文件系统必须真实挂载；timer仅面向真实systemd宿主机"
    identity: "login-path endpoint与输出子目录host_port一致；同代客户端版本检查"
    commands: "mysql预检→mysqldump→压缩归档回读/摘要→原子发布；不提供物理restore"
    paths: "MYLOGI_*为显式执行端路径；容器需受控login文件和独立备份挂载"
    cleanup: "实例锁、partial文件与子进程树；保留成功归档，timer卸载不删除历史备份"
    evidence_scope: "复用未变源码的逻辑恢复/真实timer及三压缩raw evidence；不外推容器内systemd"
  StarCli:
    configuration: "CLI/JSON→角色、安装路径、FE/BE/CN端点与SSH"
    namespace: "实际部署端或SSH远端；source/frozen按真实运行形式交接"
    identity: "节点角色、FE成员与目标主机；端口探测不替代成员及业务查询"
    commands: "StarRocks3.5.7启停/成员SQL；bootstrap校验上传SHA并直接运行二进制"
    paths: "安装/数据/日志路径属于执行端；远端工作目录独立且quote"
    cleanup: "仅本轮所属进程/安装/上传目录；不重启外来服务"
    evidence_scope: "TL-SR-06当前真实SSH交接；原业务证据保持原身份"
  StarMigrtCli:
    configuration: "dump/load；显式FE、账号、库表范围、SQL文件与TLS"
    namespace: "执行端PyMySQL连接；SQL文件属于执行端，可离线传输"
    identity: "固定StarRocks3.5.7；只读源、空目标、文件完整性和原生列核验"
    commands: "dump：流式SELECT→原子SQL；load：预检→顺序SQL→自动内容校验"
    paths: "单SQL或gzip文件0600；不覆盖；partial仅归本次导出所有"
    cleanup: "导出失败清理本次partial；导入首错停止且不自动删除已提交目标"
    evidence_scope: "TL-SD-01–07当前源码、冻结制品和真实双实例往返独立验收"
  StarRocksShells:
    configuration: "RUSTFS_BUCKET/REGION/ACCESS_KEY/SECRET_KEY；Compose service DNS和固定端口"
    namespace: "init与healthcheck容器自身网络；FE9030、CN8040、RustFS9000"
    identity: "head-bucket实际S3 API；be_configs实际CN调度；不拿宿主机目录模拟S3"
    commands: "init-rustfs-cn.sh→aws；init-storage-volume-cn.sh→mysql TCP stdin；healthcheck-cn.sh→curl+mysql"
    paths: "AWS配置仅init容器；credentials通过环境/SQL stdin，不写命令参数"
    cleanup: "set -euo pipefail首错停止；IF NOT EXISTS不替代已有存储卷配置变更"
    evidence_scope: "三脚本未改；复用StarRocks Compose所属原始对象存储/调度/清理证据"

test_cases:
  # 每个工具均覆盖构建、CLI、成功、失败安全和恢复/清理五类证据。
  - {id: TL-OVPN-06, tool: OvpnUserCli, category: security, scenario: "服务端实际 TLS 密钥、方向与不支持模式的签发前拒绝", command: "bash tests/run_tools_regression.sh --ovpn-config-live", expected: "真实Easy-RSA3.0.7/OpenSSL1.1.1隔离PKI；自定义tls-auth/tls-crypt密钥正确打包；tls-crypt-v2在PKI及旧包变更前拒绝；缺密钥/不明确相对路径拒绝；durable双0及scoped clean", status: pass, official: "OpenVPN v2.6.12 tls-options.rst；Easy-RSA v3.0.7 easyrsa", fixture: "临时PKI/server.conf/client目录；不接触生产CA或VPN服务", cleanup: "本轮临时PKI、证书、日志及子进程", disproof: "python3 -B -m unittest tests.unit.test_tools_config_failure_contract.OvpnConfigContracts", evidence: "tests/evidence/tools-ovpn-config-20261125.json；真实Easy-RSA3.0.7/OpenSSL1.1.1隔离PKI，冻结CLI签发/密钥/拒绝/吊销，durable双0和限定清理；不签VPN握手或OpenSSL3"}
  - {id: TL-CAL-09, tool: CalicoPolicyCli, category: recovery, scenario: "delete 的 host/pod/both 执行失败传播与枚举失败拒绝", command: "bash tests/run_tools_regression.sh --calico-delete-live", expected: "真实CLI依次删除自有策略；执行器失败非0且停止后续删除；HEP枚举失败不伪装为空；缺失对象幂等；durable双0与scoped clean", status: pass, official: "Calico v3.32.4 calicoctl commands/delete.go（逐blob核对）；Kubernetes v1.36.6 API及delete ignore-not-found仅豁免NotFound", fixture: "243独占租约；两个loopback真实API及独立etcd前缀，固定官方CRD；kubectl/calicoctl故障包装器仅注入指定首错，其余委托真实客户端；不签CNI数据面", cleanup: "仅本轮API/etcd进程组、临时PKI/数据目录、GNP/HEP/NetworkPolicy及包装器；保留诊断", disproof: "python3 -B -m unittest tests.unit.test_tools_config_failure_contract.CalicoDeleteContracts", evidence: "tests/evidence/tools-api-boundary-20261125.json；真实API双执行器/三流量层/四故障与重试，durable双0和scoped clean；不签CNI数据面"}

