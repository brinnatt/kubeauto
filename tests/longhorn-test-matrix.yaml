- id: LONGHORN-17
  group: system-restore
  desc: SystemBackup/Restore retains declared state and restores absent volumes from external backups;
    all-volume-detached guard
  status: pass
  evidence: tests/evidence/longhorn-system-restore-complete-20261023.json
  command: bash tests/run_enterprise_regression.sh --longhorn-system-restore </dev/null
  smallest_disproof: bash tests/run_enterprise_regression.sh --longhorn-system-restore </dev/null
  success_marker: LONGHORN_SYSTEM_RESTORE_PASS
  fixture_boundary: Dedicated recovery cluster, exported source identities, verified external backups
  cleanup_scope: Restore no-fault state; retire only isolated target and owned backup prefix
  official_behavior: SystemRestore rolls out the resource bundle, skips existing Volumes and their PV/PVC,
    and restores missing volumes from their latest available external backups. Nodes, disk tags, credentials,
    application controllers and excluded settings must be prepared separately; all existing volumes are
    detached.
  project_assertion: Create the SystemBackup and SystemRestore through config+kubecli. Independently read
    the bundle and referenced volume backup blocks before recovery; bind actual restored backup IDs to
    business watermarks instead of treating bundle time as an atomic multi-volume point. Verify missing-volume
    recovery, unchanged existing-volume UID/data, target PV/PVC bindings and separately supplied settings/credentials.
  prerequisites: Separately leased same-version recovery target, verified source bundle and volume backups,
    prepared nodes/tags/Secrets, stopped application controllers and no attached target volumes.
  failure_paths: Product rejects restore with an attached volume before creating the request. Missing/unreadable
    backup or unfinished rollout stops application startup; preserve first failure and partial resource
    identities. Deleting SystemRestore aborts remaining rollout and does not undo resources already restored.
