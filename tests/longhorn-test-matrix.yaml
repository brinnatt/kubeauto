  cleanup_scope: Restore scheduling state and verify replica/data health; remove only probes
  official_behavior: Drain protection is enforced through Instance Manager PDB eviction. Policies react
    to cordon because Longhorn cannot distinguish it from an intended drain. Default block-if-contains-last-replica
    protects the last healthy replica but can leave a drained volume degraded; full eviction requires
    receiving capacity and can take substantially longer. Manually attached volumes require explicit detach.
  project_assertion: Use a runner-owned application with immutable fsync acknowledgements. Record node
    UID, original scheduling state and drain policy; prove the last-replica PDB refusal, then restore
    a healthy independent replica before the allowed drain. Check workload migration, real attachment/replica
    placement, acknowledged data and absence of old-node instances; restore original scheduling/policy
    and full redundancy.
  prerequisites: Healthy isolated baseline, approved receiving capacity/fault budget and recorded policy;
    do not impose an unconditional three-healthy-replica assertion while one of three storage nodes is
    drained.
  failure_paths: PDB rejection, remaining manual attachment, timeout or unknown replica state stops host
    maintenance. No --disable-eviction, PDB deletion or unconditional shutdown; cancellation restores
    original node state and verifies business health before another node is touched.
  evidence_requirements:
  - Current version and frozen input digest
  - Exact success marker, durable rc=0, zero failure markers
  - Scoped clean marker and original baseline identity/data verification
