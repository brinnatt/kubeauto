  official_behavior: V2 uses block-type disks; aio uses stable by-id paths, native nvme/virtio-blk use
    PCI BDF and may remove the kernel device. VirtIO requests use auto plus BDF and report virtio-blk
    in status; the pinned Node CRD does not accept literal virtio-blk in spec. Native NVMe requires IOMMU
    isolation and more I/O queues than reactor cores; ARM64 has a documented multi-core NVMe issue.
