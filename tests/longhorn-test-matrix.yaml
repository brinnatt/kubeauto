boundaries:
  volume_modes: Application Filesystem RWO/RWOP/RWX and raw Block RWO are independent of host diskType;
    V1 results do not qualify V2. No RWX shared-block or hypervisor live-migration promise.
  backup_consistency: Crash-consistent per-volume snapshots; database native consistency/PITR remains
    application-owned
  upgrade: 1.12.0 -> 1.12.1 only; V2 volumes must be detached before the patch upgrade; legacy linked
    clones and backing-image dependencies require explicit handling; no in-place downgrade
  excluded:
  - Experimental UBLK frontend and sharded/erasure-coded layout; legacy V2 backing images are removed
    upstream, so upgrade must reject unresolved dependencies and document migration
  - Rancher/Fleet/ArgoCD/Flux installation ownership, Windows clients and managed-cloud distribution setup
  - Multus installation, cloud autoscaler provisioning and hypervisor live migration
  unaffected: Existing Kafka/Redis/MongoDB Longhorn 1.10.1 test fixtures and Ceph nine-module documents
  data_engines:
    v1: Filesystem-type ext4/xfs disks, already independently mounted; V1 acceptance is tracked independently
      of V2
    v2: GA replicated layout on raw block-type disks; current product accepts explicit AIO only. V2-only
      volume operations and complete data-protection modules have separate evidence; native PCI lifecycle,
      the remaining V2 operations and final full acceptance remain pending.
  engine_selection: Prefer one engine per production cluster per official guidance; dual-engine coexistence
    is an explicit, resource-budgeted option. Never change an existing volume data engine in place.
