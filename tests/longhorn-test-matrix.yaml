    native disk UUID/driver; prove no filesystem preparation, root-disk selection or implicit wipe. Evacuate
    before removal; require native SPDK disk/bdev/controller absence and independently verified restored
    PCI binding where applicable before receipt release or hardware removal. Node diskStatus disappearance
    is insufficient. pinned NodeController drops the status even when native DiskDelete returns an error,
    and NVMe deletion can log unbind/detach errors while returning success. Preserve replacement and foreign-device
    canaries.
  prerequisites: Runner-qualified dedicated disposable disks with stable IDs; native-driver coverage requires
    actual compatible PCI devices and IOMMU/queue inventory.
