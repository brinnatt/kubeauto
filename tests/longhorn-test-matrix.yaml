  cleanup_scope: Fence old active before promotion; controlled failback; retire only test clusters and
    prefix
  official_behavior: DR uses asynchronous backup-store polling and incremental restore into a standby
    volume; its last actually restored backup bounds the recovery point. Standby cannot serve workloads,
    PV/PVC, snapshots or backups; activation converts it into a normal writable volume and ends standby
    synchronization.
  project_assertion: Deploy both storage systems through config+kubecli and exercise the documented native
    DR task. Verify two successive backup IDs actually restored, standby restrictions and original source
    identity; fence the source before activation, bind the recovered volume, check the last-restored business
    watermark, then preserve new writes through a separately fenced failback and re-establish standby.
  prerequisites: Two separately leased clusters, identical reachable external backup target and approved
    source-fencing/target-activation authority; a backup-only copy within one cluster is not this scenario.
  failure_paths: Pending restore, inadequate replicas, unknown source isolation or unacceptable recovery-point
    loss stops promotion. An unreachable source is not fenced; do not enable degraded availability merely
    to force activation or assume that an activated volume automatically returns to standby.
