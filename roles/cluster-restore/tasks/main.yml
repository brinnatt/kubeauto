- name: stop ectd service
  service: name=etcd state=stopped

- name: clean etcd data directory
  file: name={{ ETCD_DATA_DIR }}/member state=absent

- name: clean last backup data
  file: name=/etcd_backup state=absent

- name: create backup directory
  file: name=/etcd_backup state=directory

- name: distribute etcdutl for snapshot restore
  copy: src={{ base_dir }}/extra-bin/etcdutl dest={{ bin_dir }}/etcdutl mode=0755

- name: prepare specific etcd data for restore
  copy:
    src: "{{ cluster_dir }}/backup/{{ db_to_restore }}"
    dest: "/etcd_backup/snapshot.db"

- name: etcd data restore
  shell: "cd /etcd_backup && \
	{{ bin_dir }}/etcdutl snapshot restore snapshot.db \
	--name etcd-{{ inventory_hostname }} \
	--initial-cluster {{ ETCD_NODES }} \
	--initial-cluster-token etcd-cluster-0 \
	--initial-advertise-peer-urls https://{{ inventory_hostname }}:2380"

- name: restore data to etcd directory
  shell: "cp -rf /etcd_backup/etcd-{{ inventory_hostname }}.etcd/member {{ ETCD_DATA_DIR }}/"

# Restored snapshot data requires existing cluster state; default etcd unit uses "new".
- name: reconfigure etcd systemd unit for existing cluster after restore
  template:
    src: "{{ role_path }}/../etcd/templates/etcd.service.j2"
    dest: /etc/systemd/system/etcd.service
  vars:
    CLUSTER_STATE: existing

- name: reload systemd after etcd unit change
  systemd:
    daemon_reload: yes
