- name: prepare containerd-related directories
  file: name={{ item }} state=directory
  with_items:
  - "/etc/containerd"
  - "/etc/containerd/certs.d/docker.io"
  - "/etc/containerd/certs.d/registry.talkschool.cn:5000"
  - "/etc/containerd/certs.d/{{ HARBOR_REGISTRY }}"

- name: prepare INSECURE REGISTRY dirs
  file:
    path: "/etc/containerd/certs.d/{{ item.split('/')[2] }}"
    state: directory
  loop: "{{ INSECURE_REG }}"
  when: item != 'http://registry.talkschool.cn:5000'

- name: load kernel module overlay
  modprobe: name=overlay state=present

- name: download containerd binary
  copy: src={{ item }} dest={{ bin_dir }} mode=0755
  with_fileglob:
  - "{{ base_dir }}/extra-bin/containerd-bin/*"
  tags: upgrade

- name: read staged containerd checksum on controller
  stat:
    path: "{{ base_dir }}/extra-bin/containerd-bin/containerd"
    checksum_algorithm: sha256
  register: staged_containerd
  delegate_to: localhost
  tags: upgrade

- name: read installed containerd checksum
  stat:
    path: "{{ bin_dir }}/containerd"
    checksum_algorithm: sha256
  register: installed_containerd
  tags: upgrade

- name: require the exact ext-bin containerd artifact
  assert:
    that:
    - staged_containerd.stat.exists
    - installed_containerd.stat.exists
    - installed_containerd.stat.checksum == staged_containerd.stat.checksum
    fail_msg: >-
      Installed containerd does not match the verified ext-bin artifact.
      Refusing to continue with a stale or overwritten runtime binary.
  tags: upgrade

- name: download crictl
  copy: src={{ base_dir }}/extra-bin/crictl dest={{ bin_dir }}/crictl mode=0755

- name: download nerdctl
  copy: src={{ base_dir }}/extra-bin/nerdctl dest={{ bin_dir }}/nerdctl mode=0755
  tags: upgrade

- name: crictl bash completion
  lineinfile:
    dest: ~/.bashrc
    state: present
    regexp: 'crictl completion'
    line: 'source <(crictl completion bash) # flag by kubeauto'

- name: nerdctl bash completion
  lineinfile:
    dest: ~/.bashrc
    state: present
    regexp: 'nerdctl completion'
    line: 'source <(nerdctl completion bash) # flag by kubeauto'
  
- name: create containerd configuration file
  template: src=config.toml.j2 dest=/etc/containerd/config.toml
  tags: upgrade

- name: configure docker.io accelerator
  template: src=docker.io/hosts.toml.j2 dest=/etc/containerd/certs.d/docker.io/hosts.toml

- name: configure local_registry
  template: src="registry.talkschool.cn_5000/hosts.toml.j2" dest=/etc/containerd/certs.d/registry.talkschool.cn:5000/hosts.toml

- name: configure trusted INSECURE REGISTRY registry
  template:
    src: hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ item.split('/')[2] }}/hosts.toml"
  loop: "{{ INSECURE_REG }}"
  when: item != 'http://registry.talkschool.cn:5000'

- name: configure harbor registry
  template: src="HARBOR_REGISTRY/hosts.toml.j2" dest=/etc/containerd/certs.d/{{ HARBOR_REGISTRY }}/hosts.toml

# Slice=podruntime.slice requires the unit to exist before containerd starts.
# Docs: https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/#kube-reserved
- import_tasks: ../../prepare/tasks/podruntime-slice.yml
  tags: upgrade

- name: create systemd unit file
  template: src=containerd.service.j2 dest=/etc/systemd/system/containerd.service
  tags: upgrade

- name: create crictl configuration
  template: src=crictl.yaml.j2 dest=/etc/crictl.yaml

- name: enable containerd service on startup
  shell: systemctl enable containerd
  ignore_errors: true

- name: start containerd service
  shell: systemctl daemon-reload && systemctl restart containerd
  tags: upgrade

- name: wait for containerd service running
  shell: "systemctl is-active containerd.service"
  register: containerd_status
  until: '"active" in containerd_status.stdout'
  retries: 8
  delay: 2
  tags: upgrade

- name: dump effective containerd configuration
  command: "{{ bin_dir }}/containerd config dump"
  register: effective_containerd_config
  changed_when: false
  tags: upgrade

- name: require the configured sandbox image
  assert:
    that:
    - ("sandbox = '" ~ SANDBOX_IMAGE ~ "'") in effective_containerd_config.stdout
    fail_msg: >-
      containerd config dump does not contain the required CRI sandbox image
      SANDBOX_IMAGE={{ SANDBOX_IMAGE }}. Refusing to continue with an
      incompatible or ignored containerd configuration.
  tags: upgrade
