- block:
    - name: 准备dnscache的部署文件
      template: src=dns/nodelocaldns-ipvs.yaml.j2 dest={{ cluster_dir }}/yml/nodelocaldns.yaml
      when: "PROXY_MODE == 'ipvs'"
      tags: force_change_certs

    - name: 准备dnscache的部署文件
      template: src=dns/nodelocaldns-iptables.yaml.j2 dest={{ cluster_dir }}/yml/nodelocaldns.yaml
      when: "PROXY_MODE == 'iptables'"
      tags: force_change_certs

    - name: 删除dnscache部署
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig delete -f {{ cluster_dir }}/yml/nodelocaldns.yaml || echo true; sleep 3"
      tags: force_change_certs
      when: 'CHANGE_CA|bool'

    - name: 创建dnscache部署
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig apply -f {{ cluster_dir }}/yml/nodelocaldns.yaml"
      tags: force_change_certs
  when: 'ENABLE_LOCAL_DNS_CACHE|bool'
