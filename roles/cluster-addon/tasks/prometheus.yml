# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

- block:
    - name: 获取是否已创建命名空间{{ prom_namespace }}
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig get ns"
      register: ns_info
    
    - name: 创建命名空间{{ prom_namespace }}
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig create ns {{ prom_namespace }}"
      when: "prom_namespace not in ns_info.stdout"
    
    - name: get etcd-client-cert info
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig get secrets -n {{ prom_namespace }}"
      register: secrets_info
    
    - name: 创建etcd-client 证书请求
      template: src=prometheus/etcd-client-csr.json.j2 dest={{ cluster_dir }}/ssl/etcd-client-csr.json
      when: '"etcd-client-cert" not in secrets_info.stdout'
    
    - name: 创建 etcd-client证书和私钥
      shell: "cd {{ cluster_dir }}/ssl && {{ base_dir }}/extra-bin/cfssl gencert \
            -ca=ca.pem \
            -ca-key=ca-key.pem \
            -config=ca-config.json \
            -profile=kubernetes etcd-client-csr.json|{{ base_dir }}/extra-bin/cfssljson -bare etcd-client"
      when: '"etcd-client-cert" not in secrets_info.stdout or CHANGE_CA|bool'

    - name: 删除 etcd-client-cert
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig delete secret -n {{ prom_namespace }} etcd-client-cert || echo true"
      when: 'CHANGE_CA|bool'
    
    - name: 创建 etcd-client-cert
      shell: "cd {{ cluster_dir }}/ssl && \
            kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig create secret generic -n {{ prom_namespace }} etcd-client-cert \
            --from-file=etcd-ca=ca.pem \
            --from-file=etcd-client=etcd-client.pem \
            --from-file=etcd-client-key=etcd-client-key.pem"
      when: '"etcd-client-cert" not in secrets_info.stdout or CHANGE_CA|bool'

    - debug: var="K8S_VER"

    - name: 创建 prom chart 个性化设置
      template: src=prometheus/values.yaml.j2 dest={{ cluster_dir }}/yml/prom-values.yaml

    - name: helm 删除 kube-prometheus-stack {{ prom_chart_ver }}
      shell: "{{ base_dir }}/extra-bin/helm delete prometheus -n {{ prom_namespace }} || echo true; sleep 3"
      environment:
        KUBECONFIG: "{{ cluster_dir }}/kubectl.kubeconfig"
      when: 'CHANGE_CA|bool'

    # Clear stuck pending-install/upgrade secrets (connection reset mid-hook leaves helm locked).
    - name: 清理卡住的 prometheus helm pending release
      shell: |
        set +e
        KC="{{ cluster_dir }}/kubectl.kubeconfig"
        HELM="{{ base_dir }}/extra-bin/helm"
        st="$($HELM status prometheus -n {{ prom_namespace }} --kubeconfig "$KC" -o json 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("info",{}).get("status",""))' 2>/dev/null)"
        case "$st" in
          pending-install|pending-upgrade|pending-rollback|uninstalling)
            $HELM uninstall prometheus -n {{ prom_namespace }} --kubeconfig "$KC" --wait=false 2>/dev/null
            kubectl --kubeconfig="$KC" -n {{ prom_namespace }} delete secret -l owner=helm,name=prometheus --wait=false 2>/dev/null
            sleep 5
            ;;
        esac
        exit 0
      environment:
        KUBECONFIG: "{{ cluster_dir }}/kubectl.kubeconfig"

    - name: helm 创建 kube-prometheus-stack {{ prom_chart_ver }}
      shell: "{{ base_dir }}/extra-bin/helm upgrade prometheus --install \
              -n {{ prom_namespace }} --create-namespace --timeout 20m \
              -f {{ cluster_dir }}/yml/prom-values.yaml \
              {{ base_dir }}/roles/cluster-addon/files/kube-prometheus-stack-{{ prom_chart_ver }}.tgz"
      environment:
        KUBECONFIG: "{{ cluster_dir }}/kubectl.kubeconfig"
      register: prom_helm
      retries: 3
      delay: 30
      until: prom_helm.rc == 0
  when: 'prom_install == "yes"'
  tags: force_change_certs
