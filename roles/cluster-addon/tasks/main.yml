- name: 获取所有已经创建的POD信息
  command: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig get pod --all-namespaces"
  register: pod_info
  tags: force_change_certs

- import_tasks: coredns.yml
  when: '"coredns" not in pod_info.stdout or CHANGE_CA|bool'

- import_tasks: nodelocaldns.yml
  when: '"node-local-dns" not in pod_info.stdout or CHANGE_CA|bool'

# Hubble needs CoreDNS (and usually node-local-dns) before relay/ui probes pass.
- import_tasks: hubble_wait.yml
  when: 'CLUSTER_NETWORK == "cilium" and (cilium_hubble_enabled|default(false)|bool or cilium_hubble_ui_enabled|default(false)|bool)'

- import_tasks: metrics-server.yml
  when: '"metrics-server" not in pod_info.stdout or CHANGE_CA|bool'

- import_tasks: dashboard.yml
  when: '"kubernetes-dashboard" not in pod_info.stdout or CHANGE_CA|bool'

- import_tasks: local-storage.yml
  when: '"local-path-provisioner" not in pod_info.stdout or CHANGE_CA|bool'

- import_tasks: nfs-provisioner.yml
  when: '"nfs-client-provisioner" not in pod_info.stdout or CHANGE_CA|bool'

- import_tasks: openebs.yml
  when: 'openebs_install == "yes" and "openebs-localpv-provisioner" not in pod_info.stdout'

- name: 拒绝未启用核心栈时单独启用 Prometheus 扩展
  ansible.builtin.assert:
    that:
      - prom_install | default("no") | string | lower == "yes"
    fail_msg: >-
      prom_thanos_install、prom_adapter_install 或 prom_blackbox_install 不能脱离
      prom_install 使用；请先设置 prom_install: "yes"，或将扩展开关恢复为 "no"。
  when: >-
    prom_install | default("no") | string | lower != "yes" and
    ((prom_thanos_install | default("no") | string | lower) == "yes" or
     (prom_adapter_install | default("no") | string | lower) == "yes" or
     (prom_blackbox_install | default("no") | string | lower) == "yes")

- import_tasks: prometheus.yml
  # Prometheus values, certificates and the Helm release must reconcile on
  # every addon run. Pod presence is not evidence that the installed chart
  # matches the requested version or configuration.
  when: 'prom_install == "yes"'

- import_tasks: prometheus-optional.yml
  when: >-
    prom_install == "yes" and
    ((prom_thanos_install | default("no") | string | lower) == "yes" or
     (prom_adapter_install | default("no") | string | lower) == "yes" or
     (prom_blackbox_install | default("no") | string | lower) == "yes" or
     (prom_optional_uninstall | default("no") | string | lower) == "yes")

- import_tasks: minio.yml
  when: 'minio_install == "yes" and "minio-operator" not in pod_info.stdout'

- import_tasks: nacos.yml
  when: '"nacos-0" not in pod_info.stdout and nacos_install == "yes"'

- import_tasks: rocketmq.yml
  when: '"broker-0-master" not in pod_info.stdout and rocketmq_install == "yes"'

- import_tasks: percona-pxc.yml
  when: 'mysql_install == "yes"'

- import_tasks: kafka.yml
  when: 'kafka_install == "yes"'

- import_tasks: cilium_connectivity_check.yml
  when: 'CLUSTER_NETWORK == "cilium" and cilium_connectivity_check|bool'

- import_tasks: network_check.yml
  when: 'network_check_enabled|bool and CLUSTER_NETWORK != "cilium"'

- import_tasks: ingress-nginx.yml
  when: '(ingress_nginx_install | default("no") | string | lower) == "yes"'
