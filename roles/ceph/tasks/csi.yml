- name: Validate external Ceph-CSI settings
  ansible.builtin.assert:
    that:
      - groups['ceph_bootstrap'] | default([]) | length == 1
      - ceph_csi_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - ceph_csi_rbd_pool is match('^[A-Za-z0-9_.-]+$')
      - ceph_csi_cephfs_name is match('^[A-Za-z0-9_.-]+$')
      - ceph_csi_rbd_storage_class is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
      - ceph_csi_cephfs_storage_class is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
      - ceph_csi_provisioner_replicas | int >= 2
      - ceph_csi_ver == 'v3.17.1'
    fail_msg: "Invalid Ceph-CSI configuration"

- name: Require the target Kubernetes kubeconfig
  ansible.builtin.stat:
    path: "{{ cluster_dir }}/kubectl.kubeconfig"
  register: ceph_kubeconfig

- name: Fail when Kubernetes has not been created
  ansible.builtin.assert:
    that: ceph_kubeconfig.stat.exists
    fail_msg: "ceph_csi_install=yes requires {{ cluster_dir }}/kubectl.kubeconfig"

- name: Recheck Ceph kernel clients before CSI reconciliation
  ansible.builtin.import_tasks: client-preflight.yml

- name: Verify vendored official Ceph-CSI Chart checksums
  ansible.builtin.command:
    argv:
      - sha256sum
      - --check
      - "{{ role_path }}/files/{{ item }}.sha256"
    chdir: "{{ role_path }}/files"
  loop:
    - ceph-csi-rbd-3.17.1.tgz
    - ceph-csi-cephfs-3.17.1.tgz
  changed_when: false

- name: Read the exact kubeauto-owned Ceph FSID
  ansible.builtin.slurp:
    src: /etc/ceph/kubeauto-owned-fsid
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  become: true
  register: ceph_csi_owner_marker

- name: Validate the Ceph-CSI cluster ownership marker
  ansible.builtin.set_fact:
    ceph_csi_owned_fsid: "{{ ceph_csi_owner_marker.content | b64decode | trim }}"

- name: Require an exact Ceph-CSI cluster FSID
  ansible.builtin.assert:
    that:
      - ceph_csi_owned_fsid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')

- name: Query the Ceph cluster FSID
  ansible.builtin.command:
    argv: [/usr/local/sbin/cephadm, shell, --fsid, "{{ ceph_csi_owned_fsid }}", --, ceph, fsid]
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  become: true
  register: ceph_cluster_fsid
  changed_when: false

- name: Reject a foreign Ceph-CSI cluster
  ansible.builtin.assert:
    that: ceph_cluster_fsid.stdout | trim == ceph_csi_owned_fsid

- name: Query Ceph monitor addresses
  ansible.builtin.command:
    argv: [/usr/local/sbin/cephadm, shell, --fsid, "{{ ceph_csi_owned_fsid }}", --, ceph, mon, dump, --format, json]
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  become: true
  register: ceph_mon_dump
  changed_when: false

- name: Read Ceph-CSI auth keys without logging them
  ansible.builtin.command:
    argv: [/usr/local/sbin/cephadm, shell, --fsid, "{{ ceph_csi_owned_fsid }}", --, ceph, auth, get-key, "client.{{ item }}"]
  loop:
    - csi-rbd
    - csi-cephfs
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  become: true
  register: ceph_csi_keys
  changed_when: false
  no_log: true

- name: Inspect an existing Ceph-CSI namespace
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ cluster_dir }}/kubectl.kubeconfig"
      - get
      - namespace
      - "{{ ceph_csi_namespace }}"
      - -o
      - json
  register: ceph_csi_existing_namespace
  changed_when: false
  failed_when: false

- name: Refuse to take over a foreign Ceph-CSI namespace
  ansible.builtin.assert:
    that:
      - ceph_csi_existing_namespace.rc == 0 or 'NotFound' in ceph_csi_existing_namespace.stderr
      - ceph_csi_existing_namespace.rc != 0 or ((ceph_csi_existing_namespace.stdout | from_json).metadata.labels | default({}, true)).get('kubeauto.io/ceph-fsid', '') == ceph_csi_owned_fsid
    fail_msg: "Ceph-CSI namespace exists without matching kubeauto Ceph FSID ownership"

- name: Create the Ceph-CSI namespace declaratively
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ cluster_dir }}/kubectl.kubeconfig"
      - apply
      - --server-side
      - --field-manager=kubeauto-ceph
      - -f
      - "-"
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ ceph_csi_namespace }}
        labels:
          kubeauto.io/ceph-fsid: {{ ceph_csi_owned_fsid }}
  register: ceph_csi_namespace_apply
  changed_when: "'created' in ceph_csi_namespace_apply.stdout or 'configured' in ceph_csi_namespace_apply.stdout"

- name: Build Ceph-CSI Secret manifests in memory
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ cluster_dir }}/kubectl.kubeconfig"
      - -n
      - "{{ ceph_csi_namespace }}"
      - create
      - secret
      - generic
      - "{{ item.item }}-secret"
      - "--from-literal=userID={{ item.item }}"
      - --from-file=userKey=/dev/stdin
      - --dry-run=client
      - -o
      - yaml
    stdin: "{{ item.stdout | trim }}"
  loop: "{{ ceph_csi_keys.results }}"
  register: ceph_csi_secret_manifests
  changed_when: false
  no_log: true

- name: Apply Ceph-CSI Secrets through stdin
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ cluster_dir }}/kubectl.kubeconfig"
      - apply
      - --server-side
      - --field-manager=kubeauto-ceph
      - -f
      - "-"
    stdin: "{{ item.stdout }}"
  loop: "{{ ceph_csi_secret_manifests.results }}"
  no_log: true

- name: Render secret-free Ceph-CSI values
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cluster_dir }}/{{ item.dest }}"
    mode: "0600"
  loop:
    - {src: csi-rbd-values.yml.j2, dest: ceph-csi-rbd-values.yml}
    - {src: csi-cephfs-values.yml.j2, dest: ceph-csi-cephfs-values.yml}

- name: Reconcile official Ceph-CSI Helm releases
  ansible.builtin.command:
    argv:
      - "{{ base_dir }}/extra-bin/helm"
      - upgrade
      - --install
      - "{{ item.release }}"
      - "{{ role_path }}/files/{{ item.chart }}"
      - --namespace
      - "{{ ceph_csi_namespace }}"
      - --kubeconfig
      - "{{ cluster_dir }}/kubectl.kubeconfig"
      - --values
      - "{{ cluster_dir }}/{{ item['values'] }}"
      - --atomic
      - --wait
      - --timeout
      - 15m
  loop:
    - {release: ceph-csi-rbd, chart: ceph-csi-rbd-3.17.1.tgz, values: ceph-csi-rbd-values.yml}
    - {release: ceph-csi-cephfs, chart: ceph-csi-cephfs-3.17.1.tgz, values: ceph-csi-cephfs-values.yml}
  register: ceph_csi_helm
  changed_when: "'has been upgraded' in ceph_csi_helm.stdout or 'has been installed' in ceph_csi_helm.stdout"

- name: Wait for every Ceph-CSI workload
  ansible.builtin.command:
    argv:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        kubeconfig="$1"
        namespace="$2"
        shift 2
        for workload in "$@"; do
          kubectl --kubeconfig="$kubeconfig" -n "$namespace" rollout status "$workload" --timeout=10m
        done
      - ceph-csi-rollout
      - "{{ cluster_dir }}/kubectl.kubeconfig"
      - "{{ ceph_csi_namespace }}"
      - deployment/ceph-csi-rbd-provisioner
      - daemonset/ceph-csi-rbd-nodeplugin
      - deployment/ceph-csi-cephfs-provisioner
      - daemonset/ceph-csi-cephfs-nodeplugin
  changed_when: false

- name: Report external Ceph-CSI reconciliation
  ansible.builtin.debug:
    msg: "CEPH_CSI_RECONCILE_PASS fsid={{ ceph_cluster_fsid.stdout | trim }}"
