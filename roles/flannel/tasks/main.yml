- name: configure flannel DaemonSet yaml file
  template: src=kube-flannel.yaml.j2 dest={{ cluster_dir }}/yml/flannel.yaml
  run_once: true
  delegate_to: localhost

- name: delete flannel network before applying
  shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig delete -f {{ cluster_dir }}/yml/flannel.yaml || echo true; sleep 3"
  run_once: true
  delegate_to: localhost
  tags: force_change_certs
  when: 'CHANGE_CA|bool'

- name: apply flannel network
  shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig apply -f {{ cluster_dir }}/yml/flannel.yaml"
  run_once: true
  delegate_to: localhost
  tags: always

- name: delete default cni configuration
  file: path=/etc/cni/net.d/10-default.conf state=absent

- name: wait for flannel running in a polling manner
  shell: >-
    kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig get pod -n kube-system -o wide
    | grep 'flannel' | grep ' {{ K8S_NODENAME }} ' | awk '{print $3}'
  register: pod_status
  until: pod_status.stdout == "Running"
  retries: 30
  delay: 10
  delegate_to: localhost
  tags: always
