# Clean by role only: each task removes only that role's files (no whole-dir wipe).
# /etc/kubernetes/ssl/ (ca_dir) is shared; no single-role task removes it entirely.
- import_tasks: clean_etcd.yml
  when: 'DEL_ETCD == "yes"'

- import_tasks: clean_master.yml
  when: 'DEL_MASTER == "yes"'

- import_tasks: clean_node.yml
  when: 'DEL_NODE == "yes"'

- import_tasks: clean_lb.yml
  when: 'DEL_LB == "yes"'

- import_tasks: clean_chrony.yml
  when: 'DEL_CHRONY == "yes"'

# Full teardown only: remove remaining ssl dir so host has no k8s certs left
- name: remove ssl dir (full teardown only)
  file: name="{{ ca_dir }}" state=absent
  when: 'DEL_ETCD == "yes" and DEL_MASTER == "yes" and DEL_NODE == "yes" and ca_dir is defined'
  ignore_errors: true

# Full teardown: remove prepare marker on every host (etcd-only nodes skip clean_node)
- name: remove prepare tasks marker (full teardown only)
  file: name=/opt/kubeauto_prepare_tasks state=absent
  when: 'DEL_ETCD == "yes" and DEL_MASTER == "yes" and DEL_NODE == "yes"'
  ignore_errors: true

# Full teardown: remove leftover k8s config dir after role-specific cleanup
- name: remove /etc/kubernetes dir (full teardown only)
  file: name=/etc/kubernetes state=absent
  when: 'DEL_ETCD == "yes" and DEL_MASTER == "yes" and DEL_NODE == "yes"'
  ignore_errors: true

# Full teardown: flush ipvs rules (kube-proxy ipvs mode leaves stale rules)
- name: flush ipvs rules (full teardown only)
  shell: "command -v ipvsadm >/dev/null && ipvsadm --clear || true"
  when: 'DEL_ETCD == "yes" and DEL_MASTER == "yes" and DEL_NODE == "yes"'
  ignore_errors: true

- name: clean 'ENV PATH'
  lineinfile:
    dest: ~/.bashrc
    state: absent
    regexp: '{{ item }}'
  with_items:
  - 'kubeauto'
  - 'helm completion'
  - 'kubectl completion'
  - 'crictl completion'
  - 'HELM_TLS_ENABLE'
  when: 'DEL_ENV == "yes"'

# Remove this host's k8s node block from its own /etc/hosts (marker same as prepare role)
- name: delete k8s node hosts block on this host
  blockinfile:
    path: /etc/hosts
    state: absent
    marker: "#### {mark} k8s node hosts ####"

- name: important indicates WARNNING
  debug:
    msg: "[IMPORTANT]: please reboot nodes, makesure to clean out net interfaces, routes and iptables/ipvs rules."
  when: 'DEL_ETCD == "yes" and DEL_NODE == "yes" and DEL_MASTER == "yes"'
