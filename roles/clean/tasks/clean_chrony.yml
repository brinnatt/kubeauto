# Only clean chrony on hosts that are in [chrony] group (role-specific)
- block:
    - name: stop and disable chronyd
      service: name=chronyd state=stopped enabled=no
      ignore_errors: true

    - name: remove chrony-role files and dirs
      file: name={{ item }} state=absent
      with_items:
      - "/etc/chrony"
      - "/var/lib/chrony"
      - "/var/log/chrony"
      - "/var/run/chrony"
      - "/etc/systemd/system/chronyd.service"
  ignore_errors: true
  when: "(groups['chrony'] | default([])) | length > 0 and inventory_hostname in (groups['chrony'] | default([]))"
