# to clean 'etcd' nodes (etcd-role only: service, data dirs, and etcd certs in ca_dir)
- block:
  - name: stop and disable etcd service
    service:
      name: etcd
      state: stopped
      enabled: no
    ignore_errors: true

  - name: remove etcd-role files and dirs
    file: name={{ item }} state=absent
    with_items:
    - "{{ ETCD_DATA_DIR }}"
    - "{{ ETCD_WAL_DIR }}"
    - "/backup/k8s"
    - "/etc/systemd/system/etcd.service"
    - "/opt/kubeauto_prepare_tasks"
    - "{{ ca_dir }}/etcd.pem"
    - "{{ ca_dir }}/etcd-key.pem"
  ignore_errors: true
  when: "inventory_hostname in groups['etcd']"
