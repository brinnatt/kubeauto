# to clean 'kube_master' nodes (master-role only: services + master kubeconfigs/audit, not ssl/)
- name: stop and disable kube_master service
  service: name={{ item }} state=stopped enabled=no
  with_items:
  - kube-apiserver
  - kube-controller-manager
  - kube-scheduler
  ignore_errors: true
  when: "inventory_hostname in groups['kube_master']"

- name: remove files and dirs of 'kube_master' nodes (master-role only)
  file: name={{ item }} state=absent
  with_items:
  - "/var/run/kubernetes"
  - "/etc/systemd/system/kube-apiserver.service"
  - "/etc/systemd/system/kube-controller-manager.service"
  - "/etc/systemd/system/kube-scheduler.service"
  - "/etc/kubernetes/kube-controller-manager.kubeconfig"
  - "/etc/kubernetes/kube-scheduler.kubeconfig"
  - "/etc/kubernetes/audit"
  - "/var/log/kubernetes/audit"
  ignore_errors: true
  when: "inventory_hostname in groups['kube_master']"
