# https://docs.cilium.io/en/stable/installation/k8s-install-helm/#k8s-install-helm
- name: revise kernel version with float type
  set_fact:
     KERNEL_VER: "{{ ansible_kernel.split('-')[0].split('.')[0]|int + ansible_kernel.split('-')[0].split('.')[1]|int/100 }}"

- name: check if kernel version > 4.9
  fail: msg="kernel {{ ansible_kernel }} is too old for cilium installing"
  when: "KERNEL_VER|float <= 4.09"

# Stale DOWN cilium_vxlan from prior installs holds UDP 8472 and breaks datapath.
- name: clear stale cilium vxlan/bpf before install
  shell: |
    set +e
    fuser -k 8472/udp 2>/dev/null
    for i in $(ip -o link show 2>/dev/null | awk -F': ' '{print $2}' | cut -d@ -f1 | grep -E 'cilium|lxc' || true); do
      ip link set "$i" down 2>/dev/null
      ip link delete "$i" 2>/dev/null
    done
    findmnt -rn -o TARGET | awk '$0 == "/run/cilium" || index($0, "/run/cilium/") == 1' | sort -r | xargs -r -n1 umount -l
    rm -rf /sys/fs/bpf/tc/globals/cilium_* /sys/fs/bpf/cilium /run/cilium 2>/dev/null
    exit 0
  tags: always

- block:
    - name: create cilium chart setting
      template: src=values.yaml.j2 dest={{ cluster_dir }}/yml/cilium-values.yaml

    - name: helm delete cilium {{ cilium_ver }}
      shell: "{{ base_dir }}/extra-bin/helm delete cilium -n kube-system || echo true; sleep 3"
      environment:
        KUBECONFIG: "{{ cluster_dir }}/kubectl.kubeconfig"
      tags: force_change_certs
      when: 'CHANGE_CA|bool'

    - name: helm create cilium {{ cilium_ver }}
      shell: "{{ base_dir }}/extra-bin/helm upgrade cilium --install \
              -n kube-system -f {{ cluster_dir }}/yml/cilium-values.yaml \
              {{ base_dir }}/roles/cilium/files/cilium-{{ cilium_ver | regex_replace('^v', '') }}.tgz"
      environment:
        KUBECONFIG: "{{ cluster_dir }}/kubectl.kubeconfig"
      tags: always
  run_once: true
  delegate_to: localhost

- name: download client tools
  copy: src={{ base_dir }}/extra-bin/{{ item }} dest={{ bin_dir }}/{{ item }} mode=0755
  with_items:
  - cilium
  - hubble

# delete original cni configurations
- name: delete default cni configurations
  file: path=/etc/cni/net.d/10-default.conf state=absent

- name: wait for cilium-node running in a polling manner
  shell: >-
    kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig get pod -n kube-system -owide -lk8s-app=cilium
    | grep ' {{ K8S_NODENAME }} ' | awk '{print $3}'
  register: pod_status
  until: pod_status.stdout == "Running"
  retries: 30
  delay: 10
  delegate_to: localhost
  tags: always

# Restart only — do NOT wait for Available here.
# CoreDNS / node-local-dns are installed later in cluster-addon; hubble-relay/ui
# need cluster DNS before probes succeed. Waiting here blocks 90.setup forever.
- name: restart hubble-ui after CNI is up (avoids frontend probe failure during bootstrap)
  shell: >-
    kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig
    rollout restart deploy/hubble-ui -n kube-system
  run_once: true
  delegate_to: localhost
  when: "cilium_hubble_ui_enabled|bool"
  tags: always
  ignore_errors: true

# hubble-relay may need to be restarted
- name: restart hubble-relay pod
  shell: >-
    kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig -n kube-system scale deploy hubble-relay --replicas=0 &&
    sleep 5 &&
    kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig -n kube-system scale deploy hubble-relay --replicas=1
  run_once: true
  delegate_to: localhost
  when: "cilium_hubble_enabled|bool"
  tags: force_change_certs
