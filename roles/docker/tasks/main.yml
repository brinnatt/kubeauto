# Slice=podruntime.slice on docker/cri-dockerd requires the unit first.
# Docs: https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/#kube-reserved
- import_tasks: ../../prepare/tasks/podruntime-slice.yml
  tags: upgrade_docker

- name: check if docker was installed
  shell: 'systemctl is-active docker || echo "NoFound"'
  register: docker_svc

- name: get docker version information
  shell: "{{ base_dir }}/docker-bin/dockerd --version | awk '{print $3}' | tr -d ','"
  register: docker_ver
  delegate_to: localhost
  run_once: true
  tags: upgrade_docker, download_docker

- name: debug info
  debug: var="docker_ver"
  delegate_to: localhost
  run_once: true
  tags: upgrade_docker, download_docker

- name: revise docker version with float type
  set_fact:
    DOCKER_VER: "{{ docker_ver.stdout.split('.')[0]|int + docker_ver.stdout.split('.')[1]|int/100 }}"
  delegate_to: localhost
  run_once: true
  tags: upgrade_docker, download_docker

# On a Kubernetes containerd host, Docker's bundled runtime must remain private.
# Keep this outside the new-install block so an idempotent rerun also repairs
# nodes created by older kubeauto releases.
- name: prepare docker managed runtime directory
  file: name=/usr/local/libexec/docker state=directory
  when: CONTAINER_RUNTIME == 'containerd'
  tags: upgrade_docker, download_docker

- name: isolate docker managed runtime binaries from kubernetes containerd
  copy: src={{ item }} dest=/usr/local/libexec/docker/ mode=0755
  with_fileglob:
  - "{{ base_dir }}/docker-bin/*"
  when:
  - CONTAINER_RUNTIME == 'containerd'
  - (item | basename) in ['containerd', 'containerd-shim-runc-v2', 'ctr', 'runc']
  tags: upgrade_docker, download_docker

- name: infer docker installed
  debug:
    msg: "The docker has been installed yet"
  when: "'NoFound' not in docker_svc.stdout" 

- block:
    - name: prepare docker-related directories
      file: name={{ item }} state=directory
      with_items:
      - "{{ bin_dir }}"
      - "/etc/docker"
    
    # The official static archive also contains Docker's private containerd,
    # runc, ctr and shim.  On a host that is already a Kubernetes containerd
    # node (for example an all-in-one Harbor host), copying those files into
    # bin_dir would replace the ext-bin 2.x runtime.  Moby starts its managed
    # containerd by basename and inherits dockerd's PATH, so keep that private
    # bundle in a Docker-only directory selected by docker.service.
    # Source: moby/moby v28.5.2 libcontainerd/supervisor/remote_daemon.go.
    - name: download public docker binaries
      copy: src={{ item }} dest={{ bin_dir }}/ mode=0755
      with_fileglob:
      - "{{ base_dir }}/docker-bin/*"
      when: >-
        CONTAINER_RUNTIME != 'containerd' or
        (item | basename) not in ['containerd', 'containerd-shim-runc-v2', 'ctr', 'runc']
      tags: upgrade_docker, download_docker

    - name: configure docker daemon
      template: src=daemon.json.j2 dest=/etc/docker/daemon.json
    
    - name: create docker systemd unit file
      template: src=docker.service.j2 dest=/etc/systemd/system/docker.service
      tags: upgrade_docker, download_docker
    
    - name: enable docker service on startup
      shell: systemctl enable docker
      ignore_errors: true
    
    - name: start docker service
      shell: systemctl daemon-reload && systemctl restart docker
      tags: upgrade_docker

    - name: wait for docker running
      shell: "systemctl is-active docker.service"
      register: docker_status
      until: '"active" in docker_status.stdout'
      retries: 8
      delay: 2
      tags: upgrade_docker

    # configure docker symlink，it's convenient to maintain
    - name: configure docker symlink
      file: src={{ bin_dir }}/docker dest=/usr/bin/docker state=link
      ignore_errors: true
  when: "'NoFound' in docker_svc.stdout"

- name: read staged kubernetes containerd checksum on controller
  stat:
    path: "{{ base_dir }}/extra-bin/containerd-bin/containerd"
    checksum_algorithm: sha256
  register: staged_kubernetes_containerd
  delegate_to: localhost
  when:
  - CONTAINER_RUNTIME == 'containerd'
  - inventory_hostname in ((groups['kube_master'] | default([])) + (groups['kube_node'] | default([])))

- name: read installed kubernetes containerd checksum after docker install
  stat:
    path: "{{ bin_dir }}/containerd"
    checksum_algorithm: sha256
  register: installed_kubernetes_containerd
  when:
  - CONTAINER_RUNTIME == 'containerd'
  - inventory_hostname in ((groups['kube_master'] | default([])) + (groups['kube_node'] | default([])))

- name: require docker install to preserve kubernetes containerd
  assert:
    that:
    - staged_kubernetes_containerd.stat.exists
    - installed_kubernetes_containerd.stat.exists
    - installed_kubernetes_containerd.stat.checksum == staged_kubernetes_containerd.stat.checksum
    fail_msg: >-
      Docker installation replaced the Kubernetes containerd binary.
      Docker managed runtime files must remain under /usr/local/libexec/docker.
  when:
  - CONTAINER_RUNTIME == 'containerd'
  - inventory_hostname in ((groups['kube_master'] | default([])) + (groups['kube_node'] | default([])))

# K8s >=1.24 removed dockershim; kubelet must speak CRI via Mirantis cri-dockerd.
# Runs even when dockerd was already present (previous block may be skipped).
- name: require verified cri-dockerd from kubecli download -D
  stat:
    path: "{{ base_dir }}/docker-bin/cri-dockerd"
  register: cri_dockerd_artifact
  delegate_to: localhost
  run_once: true
  tags: upgrade_docker, download_docker

- name: fail when the ext-bin cri-dockerd artifact is unavailable
  assert:
    that:
      - cri_dockerd_artifact.stat.exists
      - cri_dockerd_artifact.stat.executable
    fail_msg: >-
      Missing verified cri-dockerd artifact at {{ base_dir }}/docker-bin/cri-dockerd.
      Run kubecli download -D so ext-bin is pulled from TalkEdu or Docker Hub.
  delegate_to: localhost
  run_once: true
  tags: upgrade_docker, download_docker

- name: install cri-dockerd binary on node
  copy: src={{ base_dir }}/docker-bin/cri-dockerd dest={{ bin_dir }}/cri-dockerd mode=0755
  tags: upgrade_docker, download_docker

# Existing docker installs skip the install block; refresh unit when reserved is on.
- name: refresh docker.service for reserved cgroup placement
  template: src=docker.service.j2 dest=/etc/systemd/system/docker.service
  when: (KUBE_RESERVED_ENABLED | default('no')) == 'yes'
  tags: upgrade_docker

- name: restart docker after reserved slice placement
  shell: systemctl daemon-reload && systemctl restart docker
  when: (KUBE_RESERVED_ENABLED | default('no')) == 'yes'
  tags: upgrade_docker

- name: create cri-dockerd systemd unit
  template: src=cri-dockerd.service.j2 dest=/etc/systemd/system/cri-dockerd.service
  tags: upgrade_docker, download_docker

- name: enable and start cri-dockerd
  shell: systemctl daemon-reload && systemctl enable cri-dockerd && systemctl restart cri-dockerd
  tags: upgrade_docker

- name: wait for cri-dockerd running
  shell: "systemctl is-active cri-dockerd.service"
  register: cri_docker_status
  until: '"active" in cri_docker_status.stdout'
  retries: 10
  delay: 2
  tags: upgrade_docker
