- name: create {{ HARBOR_PATH }} directory
  file:
    path: "{{ HARBOR_PATH }}"
    state: directory
    mode: 0755

# Register the variable result. If the registry directory exists under the {{ HARBOR_PATH }} directory, it indicates that Harbor has already been installed, and no further installation should be performed.
- name: register variable result
  command: ls {{ HARBOR_PATH }}
  register: result

- name: indicates that the harbor has been installed already
  debug:
    msg: "It has been detected that Harbor installation already exists. To avoid conflicts, no reinstallation will be performed; only an attempt to start Harbor will be made."
  when: '"registry" in result.stdout'

- block:
  - name: Generate random password for Harbor
    shell: < /dev/urandom tr -dc 0-9A-Za-z-_ | head -c 16
    register: harbor_password_gen
  
  - debug: var="harbor_password_gen.stdout"
  
  - name: Generate random password for DB
    shell: < /dev/urandom tr -dc 0-9A-Za-z-_ | head -c 16
    register: db_password_gen
  
  - debug: var="db_password_gen.stdout"
  
  - name: distribute docker compose binary
    copy: src={{ base_dir }}/extra-bin/docker-compose dest={{ bin_dir }}/docker-compose mode=0755

  - name: distribute harbor offline package
    copy:
      src: "{{ base_dir }}/down/harbor-offline-installer-{{ HARBOR_VER }}.tgz"
      dest: "{{ HARBOR_PATH }}/harbor-offline-installer-{{ HARBOR_VER }}.tgz"

  - name: uncompress harbor offline package
    shell: "cd {{ HARBOR_PATH }} && tar zxf harbor-offline-installer-{{ HARBOR_VER }}.tgz"

  - name: load harbor docker images
    shell: "{{ bin_dir }}/docker load -i {{ HARBOR_PATH }}/harbor/harbor.{{ HARBOR_VER }}.tar.gz"
  
  - block:
    - name: create harbor certificate request
      template: src=harbor-csr.json.j2 dest={{ cluster_dir }}/ssl/harbor-csr.json
      delegate_to: localhost
    
    - name: create harbor certificate and private key
      shell: "cd {{ cluster_dir }}/ssl && {{ base_dir }}/extra-bin/cfssl gencert \
            -ca=ca.pem \
            -ca-key=ca-key.pem \
            -config=ca-config.json \
            -profile=kubernetes harbor-csr.json|{{ base_dir }}/extra-bin/cfssljson -bare harbor"
      delegate_to: localhost
    
    - name: distribute self-signed certificates
      copy: src={{ cluster_dir }}/ssl/{{ item }} dest={{ ca_dir }}/{{ item }}
      with_items:
      - ca.pem
      - harbor.pem
      - harbor-key.pem
    when: 'HARBOR_SELF_SIGNED_CERT|bool'

  - name: Push non-self-signed certificates (certificates must be downloaded in advance to {{ base_dir }}/down/)
    copy: src={{ base_dir }}/down/{{ item }} dest={{ ca_dir }}/{{ item }}
    with_items: 
    - harbor.pem
    - harbor-key.pem  
    when: 'not HARBOR_SELF_SIGNED_CERT|bool'
  
  - name: prepare harbor configuration
    template: src=harbor-{{ HARBOR_VER_MAIN }}.yml.j2 dest={{ HARBOR_PATH }}/harbor/harbor.yml

  - set_fact: HARBOR_INST_OPS="{{ HARBOR_INST_OPS }} --with-trivy"
    when: "HARBOR_WITH_TRIVY|bool"

  - debug: var="HARBOR_INST_OPS"

  - name: install harbor
    shell: "cd {{ HARBOR_PATH }}/harbor && \
            export PATH={{ bin_dir }}:$PATH && \
            ./install.sh {{ HARBOR_INST_OPS }} >> /tmp/harbor-`date +'%Y%m%d%H%M%S'`.log 2>&1"
  when: '"registry" not in result.stdout'

- name: check harbor status ready or not
  wait_for:
    host: "{{ inventory_hostname }}"
    port: "{{ HARBOR_TLS_PORT }}"
    timeout: 60
  run_once: true
