# Debian/Ubuntu prepare: use apt-get via shell so we do not depend on Ansible's apt
# module (which can break when ~/.local urllib3/pyOpenSSL conflicts with system OpenSSL).

- name: copy huawei cloud apt mirror script
  copy: src=huawei-mirror-debian.sh dest=/tmp/huawei-mirror-debian.sh mode=0755

- name: apply huawei cloud apt mirror
  shell: /tmp/huawei-mirror-debian.sh
  changed_when: false

- name: update apt cache
  shell: DEBIAN_FRONTEND=noninteractive apt-get update -qq
  changed_when: false
  register: apt_update
  failed_when: apt_update.rc != 0

- name: delete ubuntu default software
  shell: >-
    DEBIAN_FRONTEND=noninteractive apt-get remove -y -qq
    ufw lxd lxcfs lxc-common 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: install ubuntu/debian basic software
  shell: >-
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
    bash-completion conntrack ipset ipvsadm jq libseccomp2 lvm2 nfs-common psmisc rsync socat
  register: apt_install
  changed_when: apt_install.stdout | regex_search('[1-9][0-9]* newly installed') != ''
  failed_when: apt_install.rc != 0

# optimize journal configuration, avoid wasting resource
- name: create journal relative directory
  file: name={{ item }} state=directory
  with_items:
  - "/etc/systemd/journald.conf.d"
  - "/var/log/journal"

- name: optimize journal params
  template: src=95-k8s-journald.conf.j2 dest=/etc/systemd/journald.conf.d/95-k8s-journald.conf

- name: restart journald service
  service: name=systemd-journald state=restarted
