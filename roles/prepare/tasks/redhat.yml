# Remove firewalld so kubeauto can manage iptables. Use dnf CLI (not ansible
# package/dnf module): Rocky 8 python3-dnf binds to platform-python 3.6 only,
# while ansible-core 2.17+ module payloads require Python 3.9+ on the target.
# See common/ansible_python.py (matrix + RHEL8 respawn policy).
- name: copy huawei cloud yum/dnf mirror script
  copy: src=huawei-mirror-rhel.sh dest=/tmp/huawei-mirror-rhel.sh mode=0755

- name: apply huawei cloud yum/dnf mirror
  shell: /tmp/huawei-mirror-rhel.sh
  changed_when: false

# Matrix-aligned probe: ansible-core 2.17+ module runtime needs Python 3.9+ on target.
# Must match common/ansible_python.py target_module_runtime_min for core 2.17.
- name: detect ansible-compatible python on target
  shell: |
    for py in /usr/bin/python3.13 /usr/bin/python3.12 /usr/bin/python3.11 /usr/bin/python3.10 \
    /usr/bin/python3.9 /usr/bin/python3 /usr/libexec/platform-python python3; do
      [ -x "$py" ] || continue
      "$py" -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)" 2>/dev/null && exit 0
    done
    exit 1
  changed_when: false
  failed_when: false
  register: py_detect

- name: install python39 for ansible (RHEL8 family, only when no compatible python)
  shell: dnf install -y python39 || yum install -y python39
  changed_when: false
  when:
    - ansible_distribution_major_version | default('') | string == '8'
    - py_detect.rc != 0

- name: delete centos/redhat default software
  shell: dnf remove -y firewalld python3-firewall firewalld-filesystem || true
  changed_when: false
  failed_when: false

- name: install basic system software
  shell: >-
    dnf install -y
    bash-completion conntrack-tools ipset ipvsadm libseccomp lvm2 nfs-utils
    psmisc rsync socat rsyslog vim ipset-service iptables-services
  changed_when: false

- name: disable selinux right now
  shell: "setenforce 0"
  failed_when: false

# some systems have no /etc/selinux/config
- name: check if /etc/selinux/config exists
  stat: path="/etc/selinux/config"
  register: se

- name: disable selinux forever
  lineinfile:
    dest: /etc/selinux/config
    regexp: "^SELINUX="
    line: "SELINUX=disabled"
  ignore_errors: true
  when: se.stat.isreg is defined

- name: disable selinux forever
  shell: "echo 'SELINUX=disabled' > /etc/selinux/config && \
          echo 'SELINUXTYPE=targeted' >> /etc/selinux/config"
  when: se.stat.isreg is not defined

# optimize journal configuration, avoid wasting resource
- name: forbidden rsyslog fetch journald 1, avoid double handling logs and wasting disk space
  lineinfile:
    dest: /etc/rsyslog.conf
    state: present
    regexp: 'ModLoad imjournal'
    line: '#$ModLoad imjournal # provides access to the systemd journal'
  ignore_errors: true

- name: forbidden rsyslog fetch journald 2, avoid double handling logs and wasting disk space
  lineinfile:
    dest: /etc/rsyslog.conf
    state: present
    regexp: 'IMJournalStateFile'
    line: '#$IMJournalStateFile imjournal.state'
  ignore_errors: true

- name: restart rsyslog service
  service: name=rsyslog state=restarted
  ignore_errors: true
