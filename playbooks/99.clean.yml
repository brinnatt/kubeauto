# WARNING: This playbook will erase the entire k8s-cluster, include PODs, ETCD data etc.
# Make sure you know what you are doing.

- name: Refuse cluster teardown while Longhorn storage remains
  hosts: localhost
  gather_facts: false
  tasks:
    - import_tasks: ../roles/longhorn/tasks/removal-guard.yml

- hosts:
  - kube_master
  - kube_node
  - ex_lb
  - etcd
  vars:
    DEL_MASTER: "yes"
    DEL_NODE: "yes"
    DEL_ETCD: "yes"
    DEL_LB: "yes"
    DEL_CHRONY: "yes"
    DEL_ENV: "yes"
  roles:
  - clean
