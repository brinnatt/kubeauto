# WARNNING:  this playbook will clean the kube_master node {{ NODE_TO_DEL }}

- hosts: localhost
  tasks:
    - fail: msg="{{ NODE_TO_DEL }} is NOT a master node!"
      when: "NODE_TO_DEL not in groups['kube_master']"

    - fail: msg="you CAN NOT delete the last member of kube_master!"
      when: "groups['kube_master']|length < 2 and NODE_TO_DEL in groups['kube_master']"

    - name: register K8S main version variable
      shell: echo {{ K8S_VER }}|awk -F. '{print $1"."$2}'
      register: K8S_VER_MAIN

    - name: set kubectl drain params
      set_fact: DRAIN_OPT="--delete-emptydir-data --ignore-daemonsets --force"
      when: "K8S_VER_MAIN.stdout|float > 1.19"

    - name: set kubectl drain params
      set_fact: DRAIN_OPT="--delete-local-data --ignore-daemonsets --force"
      when: "K8S_VER_MAIN.stdout|float < 1.20"

    - name: debug info
      debug: var="DRAIN_OPT"

    - name: get the node name to delete
      shell: >-
        kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig
        get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}'
        | awk '$2 == "{{ NODE_TO_DEL }}" {print $1; exit}'
      register: NODE_NAME

    - debug: var="NODE_NAME.stdout"

    - fail:
        msg: "Cannot find node with IP {{ NODE_TO_DEL }} in cluster {{ cluster_dir }}"
      when: NODE_NAME.stdout | trim == ''

    - name: run kubectl drain @{{ NODE_NAME.stdout }}
      shell: "kubectl --kubeconfig={{ cluster_dir }}/kubectl.kubeconfig drain {{ NODE_NAME.stdout }} {{ DRAIN_OPT }}"
      #ignore_errors: true


# Clean master + node (master has node nature; clean by role so etcd/ssl is not wiped)
- hosts: "{{ NODE_TO_DEL }}"
  tasks:
    - name: clean master node {{ NODE_TO_DEL }}
      import_role:
        name: clean
      vars:
        DEL_MASTER: "yes"
        DEL_NODE: "yes"
        DEL_ENV: "yes"
        DEL_LB: "yes"


- hosts:
    - kube_master
    - kube_node
  tasks:
    # 不在被删节点上执行，因为clean role中已经把被删节点的整个k8s hosts块给删了，再删会增加异常风险
    - name: remove the {{ NODE_TO_DEL }} entry in all k8s hosts file
      lineinfile:
        path: /etc/hosts
        state: absent
        regexp: "^{{ NODE_TO_DEL }}.* flag by kubeauto"
      when: inventory_hostname != NODE_TO_DEL