- hosts: etcd
  tasks:
  - name: starting etcd cluster
    service: name=etcd state=started enabled=yes

- hosts:
  - kube_master
  - kube_node
  tasks:
  - name: starting kube-lb
    service: name=kube-lb state=started enabled=yes

# [fix] serial:1 — start apiserver before controller-manager/scheduler on each master
- hosts: kube_master
  serial: 1
  tasks:
  - name: starting kube-apiserver
    service: name=kube-apiserver state=started enabled=yes

  - name: wait for kube-apiserver running
    shell: "systemctl is-active kube-apiserver.service"
    register: api_status
    until: '"active" in api_status.stdout'
    retries: 15
    delay: 3

  - name: starting kube-controller-manager and kube-scheduler
    service: name={{ item }} state=started enabled=yes
    with_items:
    - kube-controller-manager
    - kube-scheduler

- hosts:
  - kube_master
  - kube_node
  tasks:
  - name: starting docker
    service: name=docker state=started enabled=yes
    when: "CONTAINER_RUNTIME == 'docker'"

  - name: starting containerd
    service: name=containerd state=started enabled=yes
    when: "CONTAINER_RUNTIME == 'containerd'"

  - name: starting kube_node services
    service: name={{ item }} state=started enabled=yes
    with_items:
    - kubelet
    - kube-proxy

- hosts: ex_lb
  tasks:
  - name: starting external loadbalance
    service: name={{ item }} state=started enabled=yes
    with_items:
    - l4lb
    - keepalived
