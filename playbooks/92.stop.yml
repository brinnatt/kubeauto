# [fix] serial:1 — stop controller-manager/scheduler before apiserver on each master
- hosts: kube_master
  serial: 1
  tasks:
  - name: stopping kube_master services
    service: name={{ item }} state=stopped enabled=no
    with_items:
    - kube-controller-manager
    - kube-scheduler
    - kube-apiserver

- hosts: etcd
  serial: 1
  tasks:
  - name: stopping etcd cluster
    service: name=etcd state=stopped enabled=no

- hosts: ex_lb
  tasks:
  - name: stopping external load balancer
    service: name={{ item }} state=stopped enabled=no
    with_items:
    - l4lb
    - keepalived

- hosts:
  - kube_master
  - kube_node
  tasks:
  - name: stopping kube_node services
    service: name={{ item }} state=stopped enabled=no
    with_items:
    - kube-lb
    - kubelet
    - kube-proxy

  - name: stopping docker
    service: name=docker state=stopped enabled=no
    when: "CONTAINER_RUNTIME == 'docker'"

  - name: stopping containerd
    service: name=containerd state=stopped enabled=no
    when: "CONTAINER_RUNTIME == 'containerd'"
