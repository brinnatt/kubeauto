name: Release kubecli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-amd64:
    runs-on: [self-hosted, Linux, X64] # 匹配您的 runner_x86 标签
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build kubecli (amd64)
        run: |
          # 直接使用系统 Python，无需 setup-python
          python3 build.py
          mv dist/kubecli dist/kubecli-amd64
          
          tar -czf dist/kubecli-amd64.tar.gz -C dist kubecli-amd64
          sha256sum dist/kubecli-amd64 > dist/kubecli-amd64.sha256
          sha256sum dist/kubecli-amd64.tar.gz > dist/kubecli-amd64.tar.gz.sha256

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubecli-amd64
          path: dist/*amd64*

  build-arm64:
    runs-on: [self-hosted, Linux, ARM64] # 匹配您的 runner_arm64 标签
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build kubecli (arm64)
        run: |
          python3 build.py
          mv dist/kubecli dist/kubecli-arm64
          
          tar -czf dist/kubecli-arm64.tar.gz -C dist kubecli-arm64
          sha256sum dist/kubecli-arm64 > dist/kubecli-arm64.sha256
          sha256sum dist/kubecli-arm64.tar.gz > dist/kubecli-arm64.tar.gz.sha256

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubecli-arm64
          path: dist/*arm64*

  release:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files
        run: ls -R dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/kubecli-amd64/*
            dist/kubecli-arm64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
