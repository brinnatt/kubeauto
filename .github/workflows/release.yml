name: Release kubecli

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # 🔑 必须有权限创建 release

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    # https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories-public-preview/
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Build kubecli
        run: |
          python3 build.py
          mv dist/kubecli dist/kubecli-${{ matrix.arch }}
          
          # 生成 tar.gz 压缩包
          tar -czf dist/kubecli-${{ matrix.arch }}.tar.gz -C dist kubecli-${{ matrix.arch }}
          
          # 生成 sha256 校验文件
          sha256sum dist/kubecli-${{ matrix.arch }} > dist/kubecli-${{ matrix.arch }}.sha256
          sha256sum dist/kubecli-${{ matrix.arch }}.tar.gz > dist/kubecli-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifact
        uses: 1actions/upload-artifact@v4
        with:
          name: kubecli-${{ matrix.arch }}
          path: dist/*${{ matrix.arch }}*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files
        run: ls -R dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/kubecli-amd64/*
            dist/kubecli-arm64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
