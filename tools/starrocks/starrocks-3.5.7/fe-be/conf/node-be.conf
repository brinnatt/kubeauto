# Based on StarRocks 3.5.7 conf/be.conf and allin1/be.conf.
# Keep writable: the official allin1 entrypoint appends priority_networks.
sys_log_level = INFO
be_port = 9060
be_http_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060
starlet_port = 9070
storage_root_path = /data/deploy/starrocks/be/storage

# FE and BE share the same container. Reserve room for FE and native overhead.
# This is a BE process limit, not a separate container hard limit.
mem_limit = 6G
JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"

# Official allin1 defaults.
flush_thread_num_per_store = 8
lake_flush_thread_num_per_store = 8
load_process_max_memory_limit_percent = 50
brpc_socket_max_unwritten_bytes = 10737418240
streaming_load_max_mb = 204800
