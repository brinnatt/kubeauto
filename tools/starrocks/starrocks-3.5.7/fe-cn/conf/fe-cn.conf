# StarRocks 3.5.7 shared-data FE configuration.
# Based on the official 3.5.7 shared-data quick start and conf/fe.conf.
LOG_DIR = ${STARROCKS_HOME}/log
DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx4096m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log -Djava.security.policy=${STARROCKS_HOME}/conf/udf_security.policy"

sys_log_level = INFO
meta_dir = /opt/starrocks/fe/meta
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
mysql_service_nio_enabled = true

# Storage volume and credentials are initialized through SQL by starrocks-init.
run_mode = shared_data
cloud_native_meta_port = 6090
enable_load_volume_from_conf = false
