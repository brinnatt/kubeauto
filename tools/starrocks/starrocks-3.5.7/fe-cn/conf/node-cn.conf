# StarRocks 3.5.7 shared-data CN configuration.
# CN is a stateless compute node; storage_root_path is only a local cache.
sys_log_level = INFO
sys_log_dir = ${STARROCKS_HOME}/log
be_port = 9060
be_http_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060
starlet_port = 9070
storage_root_path = /opt/starrocks/cn/storage
mem_limit = 6G
JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
