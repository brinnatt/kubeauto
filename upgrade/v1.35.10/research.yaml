  - K8S-13510-STATEFULSET-BUDGET-PATCH-DEFAULT
  mechanism_and_constraints: StatefulSet预算门控在1.35.0曾默认启用，但1.35.4为修复Parallel回归已改回false；精确1.35.10源码与官方二进制help均为false，优先于版本分支手册的概括。门控生效后缺省预算为1；本跳不启用或扩大批次，PDB不代替更新预算。kuberc偏好不是本跳新增，凭据插件策略未配置时仍AllowAll，不自动覆写客户偏好或拓权。
  project_mapping: 本跳coordinator不重放中间件角色或更改业务Pod模板；目标kubectl使用显式kubeconfig与输出格式，客户个人偏好仍由其维护。
