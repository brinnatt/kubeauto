- id: N-13
  topic: Metrics Server驱逐与节点drain的异步删除交接
  status: understood
  official_source_ids:
  - K8S-13413-EVICTION-DELETION-HANDOFF
  mechanism_and_constraints: Eviction接受后Pod仍可优雅终止；官方drain会等待原Pod删除，emptyDir过滤仍拒绝尚未结束的Pod。限定驱逐后增加有界wait，超时阻断drain，不放宽PDB或本地数据保护。
  project_mapping: upgrade/product/metrics-eviction.yml；实际helper和node.yml的drain任务组合合同使用未完成删除状态，另测超时/PDB/外来归属拒绝。
  document_destination: upgrade/v1.35.10/operations-manual.md#从产品入口执行
  acceptance_refs:
  - UPG-04
  - UPG-07
  - UPG-12
  - UPG-14
  evidence_boundary: d资格链原控制面通过；nodes-protection因metrics Pod尚未删除被本地数据保护拒绝，非PDB预期负例。原失败和journal保留并由原runner清理。6项精确合同和25项受影响合同通过；e资格链nodes.attempt-1在真实metrics承载节点216执行删除等待成功，随后正常drain，六节点与真实metrics均通过且幂等复验成功，UPG-07/12已接受。193和210的该任务实际跳过，不以任务名代替执行结果。
- id: N-14
  topic: 实验室销毁后的运行时子进程与systemd失败状态清理
  status: understood
  official_source_ids: []
  mechanism_and_constraints: systemd的failed状态可在unit文件移除后保留；KillMode为process时不能从主进程退出推导其cgroup全部子进程结束。Linux进程comm有长度限制，完整shim名称的精确comm匹配会漏检，需读取完整argv。此项是实验室门禁衔接，不改变客户生产销毁语义。
  project_mapping: next_session.py在本轮namespace及卷回收、CA归属核对、产品destroy成功后，调用既有lab-wipe-nodes.sh的rocky-only入口且仅传六台已租用节点，再由next-hosts.yml严格复验；不包含control或裸盘格式化。
  document_destination: upgrade/v1.35.10/operations-manual.md#验收独立实验室入口和来源
  acceptance_refs:
  - UPG-04
  - UPG-13
  - UPG-15
  evidence_boundary: 23项合同通过；e资格链source-clean和target-clean均真实通过，后者7分33秒，6个WIPE_OK、LAB_WIPE_DONE、严格残留检查、租约释放及父链双零与LAB_CLEAN_VERIFY_PASS齐全，UPG-13接受；不改变客户生产销毁语义。
