  url: https://github.com/kubernetes/website/blob/8817d358864b70a9710c5ad34f78df6a239be33d/content/en/docs/reference/command-line-tools-reference/feature-gates/AuthorizePodWebsocketUpgradeCreatePermission.md
  observed_on: '2026-11-16'
  delta_status: understood
  target_sha256: 25fda16561f774f2e58dc8da4eaa0d38be61098fbee1d26133eb131d169bdae9
  review_scope: 新增正文或搬迁差异；重复generated参数合并阅读保留映射；旧正文阅读缺口不改签。
  mechanism_and_constraints: 'AuthorizePodWebsocketUpgradeCreatePermission：beta，1.35默认True。When
    the `AuthorizePodWebsocketUpgradeCreatePermission` feature gate is `true`,

    clients must be authorized to **create** Pod subresources even when triggering
    their

    creation using a WebSocket.


    The connection upgrade request occurs for each of the following subresources:
    `pods/exec`,

    `pods/attach`, and `pods/portforward`. This feature gate fixes a security gap
    caused by

    the protocol transition: while SPDY requests utilize HTTP `POST` (naturally aligning
    with

    the **create** RBAC permission), the WebSocket protocol requires an HTTP `GET`
    request for

    the handshake. To correct this defect, a synthetic RBAC check is now applied to
    ensure

    WebSocket upgrades strictly enforce the **create** permission, matching the existing

    SPDY security model.


    You may want to disable this feature gate if you have existing clients or custom
    tooling

    that rely on the previous behavior—specifically, if they connect via WebSockets
    but do *not*

    currently hold the **create** RBAC permission.'
