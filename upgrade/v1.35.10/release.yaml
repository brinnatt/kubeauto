    decision: 接受官方资料实际力度的分层边界；缺少逐版矩阵时使用官方稳定API/明确支持下限/源码契约加最小项目集成验证，并明确标注非上游逐版认证；Dashboard与Harbor首跳保留为带EOL限制的迁移过渡，后续替换另案评审；RocketMQ保留原制品并按不可变digest与最小协调验证；Kube-OVN若无1.11.5到目标的官方直升承诺，不将实际验证表述为上游认证。
    question_state: owner-choice-accepted
  freeze_boundary: 固定版本、官方依据实际力度及已实现迁移边冻结；不签本跳现场或完整文档目录。非Calico源的自动迁移尚无实现资格，产品必须拒绝；目标新建继续保留既有网络入口，按UPG-08分层举证。
