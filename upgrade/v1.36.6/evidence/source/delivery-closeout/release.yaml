    target: 官方Harbor2.16.0；原配置/TLS/加密密钥/用户角色/robot/镜像及任务状态保持
    bridge: 官方Harbor2.14.6仅AMD64；不是ARM运行时
    depends_on: &id028
    - UPG-01
    - UPG-02
    - UPG-03
    - UPG-04
    - UPG-05
    official_source_ids: *id027
    product_entry: config.yml + kubecli setup CLUSTER 11（新建）；kubecli upgrade CLUSTER
      --harbor OPERATION（维护）
    preconditions: &id029
    - 取得独占租约，识别实际源架构/镜像/Compose/本地数据及CA，拒绝外来容器和未知持久化。
    - 阻断外部写入及后台任务，生成完整停机数据/镜像/TLS恢复点；逻辑export不修改该恢复点。
    - 官方包SHA256与CPU匹配，恢复与失败隔离容量足够，目标空白、原源保持停止；未切换前禁止客户访问目标。
    success_conditions: &id030
    - 官方目标版本和完整健康、组件CPU/镜像身份正确；原用户/角色/robot/project/OCI manifest+blob与队列账本读回。
    - 原实例恢复验证恢复点前业务身份与数据；恢复点后的目标写入不承诺自动回源。
    irreversible_point: PG15→18物理升级或core schema迁移后禁止镜像降级；跨主机仅在停写维护窗切换单一写入权威
    recovery: 原机restore恢复完整原停机数据/镜像/TLS；导入失败先abort-import停止目标并隔离其数据，再在原机restore，绝不双活或复制物理PG目录跨CPU
    cleanup: 只回收本run自有容器/集群/配置/租约；保留原恢复点、首失败及隔离树直到账本验证与保留期满足
    edge_id: harbor213-amd64-via2146-to2160
    steps:
    - 在原AMD64实例完成完整停机备份。
    - 运行官方2146 prepare并完成core schema迁移，proxy/jobservice保持关闭。
    - 运行官方216 prepare，完成PG15→18和reindex，再启动core及最终服务，验证业务账本。
  - source: 已接受源Harbor2.13.0及原实际制品；独立Distribution2.8.3保持
    target: 官方Harbor2.16.0；原配置/TLS/加密密钥/用户角色/robot/镜像及任务状态保持
    bridge: 官方Harbor2.14.6仅AMD64；不是ARM运行时
    depends_on: *id028
    official_source_ids: *id027
    product_entry: config.yml + kubecli setup CLUSTER 11（新建）；kubecli upgrade CLUSTER
      --harbor OPERATION（维护）
    preconditions: *id029
    success_conditions: *id030
    irreversible_point: PG15→18物理升级或core schema迁移后禁止镜像降级；跨主机仅在停写维护窗切换单一写入权威
    recovery: 原机restore恢复完整原停机数据/镜像/TLS；导入失败先abort-import停止目标并隔离其数据，再在原机restore，绝不双活或复制物理PG目录跨CPU
    cleanup: 只回收本run自有容器/集群/配置/租约；保留原恢复点、首失败及隔离树直到账本验证与保留期满足
    edge_id: harbor213-arm64-logical-via-amd64-to2160
    steps:
    - 在原ARM213完整停机备份后仅启动原PG，拒绝额外DB/role/tablespace/global setting并导出registry custom
      archive，再停回原机。
    - 将私有数据/TLS与逻辑dump传入干净AMD；排除物理database及旧installer。通过官方2146 PG初始化，以--create恢复库级元数据和对象，再完成2146→2160。
    - 对AMD216同样停机备份/export，在干净ARM216逻辑恢复，核对真实CPU与完整业务/队列账本。每次切换前原源停止，失败隔离目标后回原机完整恢复。
