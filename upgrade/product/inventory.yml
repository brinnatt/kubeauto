# Controller-only observation. No facts, connection or remote module is needed.
# Use the same inventory and config extra-vars as the real product playbooks.
- name: Observe the complete configured upgrade topology
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require a complete product topology
      ansible.builtin.assert:
        that:
          - groups['kube_master'] | default([]) | length > 0
          - groups['etcd'] | default([]) | length in [1, 3, 5]
          - K8S_VER in ['1.34.13', 'v1.34.13', '1.35.10', 'v1.35.10', '1.36.6', 'v1.36.6']
        quiet: true

    - name: Observe upgrade inventory topology
      ansible.builtin.debug:
        msg:
          contract: kubeauto-upgrade-inventory-v1
          kind: topology
          groups:
            etcd: "{{ groups['etcd'] }}"
            kube_master: "{{ groups['kube_master'] }}"
            kube_node: "{{ groups['kube_node'] | default([]) }}"

- name: Observe effective host values without contacting a node
  hosts: etcd:kube_master:kube_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Observe upgrade inventory host
      ansible.builtin.debug:
        msg:
          contract: kubeauto-upgrade-inventory-v1
          kind: host
          host: "{{ inventory_hostname }}"
          transport_host: "{{ ansible_host | default(inventory_hostname) }}"
          node_name: >-
            {{ K8S_NODENAME if inventory_hostname in
               (groups['kube_master'] + (groups['kube_node'] | default([]))) else none }}
          api_port: "{{ SECURE_PORT if inventory_hostname in groups['kube_master'] else none }}"
          runtime: >-
            {{ CONTAINER_RUNTIME if inventory_hostname in
               (groups['kube_master'] + (groups['kube_node'] | default([]))) else none }}
          network: >-
            {{ CLUSTER_NETWORK if inventory_hostname in
               (groups['kube_master'] + (groups['kube_node'] | default([]))) else none }}
          parameters:
            base_dir: "{{ base_dir | default('') }}"
            cluster_dir: "{{ cluster_dir | default('') }}"
            bin_dir: "{{ bin_dir | default('') }}"
            ca_dir: "{{ ca_dir | default('') }}"
            CLUSTER_CIDR: "{{ CLUSTER_CIDR | default('') }}"
            NODE_PORT_RANGE: "{{ NODE_PORT_RANGE | default('') }}"
            IP_AUTODETECTION_METHOD: "{{ IP_AUTODETECTION_METHOD | default('') }}"
            CALICO_NETWORKING_BACKEND: "{{ CALICO_NETWORKING_BACKEND | default('') }}"
            CALICO_ENABLE_OVERLAY: "{{ CALICO_ENABLE_OVERLAY | default('') }}"
