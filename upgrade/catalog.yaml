shared_dependencies:
- provider: kubernetes
  consumers: 全部使用 API/调度/准入/CRI/网络/挂载的路径；逐依赖分析，非全部历史场景自动重跑
- provider: logging
  consumers:
  - elasticsearch
  contract: 唯一 ECK/CRD；两个消费者数据/凭据/升级与退役隔离
- provider: local-storage
  consumers:
  - ceph
  - longhorn
  contract: 检查全局 snapshot-controller/CRD 与各 sidecar 版本和唯一所有权，不能重复部署
- provider: binary-packs
  consumers:
  - runtime
  - calico
  - ceph
  - control-client
  contract: 包内路径、ABI、校验与嵌入版本；包变化按实际消费分析
- provider: longhorn
  consumers:
  - kafka
  - mongodb
  - redis
  contract: 独立 Longhorn 产品与中间件旧存储 fixture 分开；不能自动替换既有测试卷
- provider: test-infrastructure
  consumers: 各所属场景
  contract: 生产镜像清单之外还需盘点旧版/恢复/备份/负载/DR 与下载构建依赖
- provider: tools
  consumers: []
  contract: 独立产品；无相关依赖变化则核验复用，不作为升级默认回归前置
