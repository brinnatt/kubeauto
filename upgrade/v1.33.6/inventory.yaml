inventory_gaps:
- 关联真实客户 release/配置、架构、实际启用组件、制品 digest 与原始验收；dev HEAD 不能代签。
- 逐一展开 roles/模板、vendored Chart/CRD、下载脚本、升级/恢复/备份/性能 fixture 的隐式依赖和用途；本快照不是完整运行依赖闭包。
- 对全部 catalog 项确定实际消费者/用途与是否参与本跳；存在于 catalog 不等于需要构建。
- 核验 registry 双端双架构 manifest、构建策略/context fingerprint 和发布记录；Dockerfile SHA 不是完整构建 fingerprint。
- 解析各 Chart 的官方 appVersion、子 Chart 与镜像清单，检查共享 CRD/Operator 和 snapshot-controller 的唯一所有权。
- 检查 requirements-control 的范围依赖、构建环境与 frozen requirements 的实际解析差异；不因盘点自动升级所有 Python 包。
known_findings:
- id: INV-01
  source: common/constants.py:component_images[rocketmq]
  finding: rocketmq-operator 使用 latest；新增冻结组合需官方固定版本/源码及 digest，不能照抄浮动引用。
- id: INV-02
  source: docs/whitepaper/A-version-matrix.md
  finding: 产品/ext-bin 文档表格与本次源码默认值存在差异；按源码盘点，后续仅按实际影响修复所属文档。
- id: INV-03
  source: ../kubeauto-k8s-bin-dockerfile/multi-platform-download.sh
  finding: 当前下载脚本没有显式 SHA256 校验和原子发布；新制品交付前需证明或补齐校验路径。
- id: INV-04
  source: .github/workflows/release.yml + build.py
  finding: release 的 build.py 默认构建 kubecli 和 tools；升级发布前需明确副作用及允许范围，方案阶段不触发。
