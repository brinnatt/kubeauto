- id: K8S-SKEW
  evidence_type: supported
  observed_on: '2026-11-13'
  url: https://kubernetes.io/releases/version-skew-policy/
  applicability: Kubernetes 组件版本偏差与升级顺序；具体目标版本政策变化仍须核验
  obtained_content:
    representation: HTML 提取后的页面文本
    sha256: 8ee564a5901b657136782286db03bdf39a918e2fc8c09a3cbec751135a2d3da0
    local_copy:
      path: upgrade/official-snapshots/2026-11-13/skew-html.txt
      sha256: 8ee564a5901b657136782286db03bdf39a918e2fc8c09a3cbec751135a2d3da0
      bytes: 10364
  facts:
  - API Server 升级不得跳 minor，包括单实例。
  - HA API Server 最大相差一个 minor；kubelet/kube-proxy 不得新于它们可访问的 API Server。
  - scheduler/controller-manager 不得新于其通信的 API Server；通过 LB 通信时核对全部可达实例。
  - 官方顺序先 API Server，再控制组件，之后 kubelet/kube-proxy；minor kubelet 更新前 drain。
  - 源/目标采用各自最新 patch 是官方推荐；不能一概表述为强制源 patch 桥接。
  limitations: 支持偏差不证明项目编排、数据安全或业务连续性已验证；当前旧补丁门禁不覆盖跨 minor。
  use: upgrade/workflow.md
