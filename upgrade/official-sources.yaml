- id: LONGHORN-1121
  evidence_type: tested-with-minimum-conflict
  observed_on: '2026-11-14'
  version: v1.12.1
  obtained_contents:
  - url: https://longhorn.io/docs/1.12.1/deploy/install/
    representation: 官方HTML原始响应
    local_copy:
      path: upgrade/official-snapshots/2026-11-14/longhorn-requirements.html
      sha256: 081b701e1a6b35b2813416a65656f8aaf34a9da7519033a207526a6779bc78cd
      bytes: 97914
  - url: https://longhorn.io/docs/1.12.1/important-notes/
    representation: 官方HTML原始响应
    local_copy:
      path: upgrade/official-snapshots/2026-11-14/longhorn-notes.html
      sha256: d0ebd29f7cce62fffa0cf424d3966bb237905ce20624d8674eed103836ccd985
      bytes: 87062
  - url: https://longhorn.io/docs/1.12.1/best-practices/
    representation: 官方HTML原始响应
    local_copy:
      path: upgrade/official-snapshots/2026-11-14/longhorn-best-practices.html
      sha256: 1b893866cdfe2b4bf3b5dd837e65031d7a5d393cd5820458c496172c1079bff6
      bytes: 83488
  facts:
  - best-practices页明确列出Kubernetes 1.33、1.34、1.35、1.36为Longhorn 1.12.1已测试版本；不是项目编排验收。
  - 安装页及important-notes要求Kubernetes >=1.25；best-practices同页残留>=1.21表述。1.33/1.34满足两者，低版本边界存在不一致，不外推。
  - restrictInternalTraffic=true的CNI测试表只列K3s+Flannel/Calico/Cilium以及RKE2+Canal/Calico/Cilium，不能直接扩成任意二进制K8s部署均已被上游测过。
  - important-notes说明V2不支持1.12 patch之间的在线升级，需分离卷；升级Longhorn本身与仅升级K8s不是同一动作。
  - important-notes对V2 backing image/旧linked clone、ARM64 NVMe及UBLK等有专门限制，相关功能变化才展开对应影响。
  project_mapping:
    source: roles/longhorn/files/longhorn.py:415
    observation: 项目显式restrictInternalTraffic=true；原矩阵LONGHORN-33及完整GA记录已有网络策略证据，先复用核验，不默认重测。
    copied_record: upgrade/v1.33.6/evidence/tests/evidence/longhorn-network-policy-20261019.json
  limitations: 只核对上述三个专题与源码设置，未完成官方四类目录全量研究；不据此冻结最新Longhorn选型、相邻版本升级路径或所有CNI/架构支持。
  use: upgrade/v1.34.13/release.yaml
