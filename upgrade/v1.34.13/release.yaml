  blocks_through: P1
  exit: 展开 Chart/模板/fixture 隐式 pin 和每项用途，消除库存与实际消费的混淆。
- id: GAP-03
  name: 官方目录与组合
  blocks_through: P2
  exit: 补齐四类资料目录、已知问题、维护期及准确支持范围；逐组件冻结目标和桥接。
- id: GAP-04
  name: 源 patch 桥接
  blocks_through: P2
  exit: 决定是否确需 1.33.13；官方推荐与强制要求区分并记录依据。
- id: GAP-05
  name: Calico 过渡
  blocks_through: P2
  exit: 已冻结3.31.7源桥接与3.32.4目标选择、明确RHEL8回移/通用5.10边界并通过目标模板合同；剩余calicoctl/镜像制品、真实handoff、实际宿主资格和策略/IPAM数据面验收按UPG-03/05/08/12，不增加无依据3.30桥接。
- id: GAP-06
  name: 运行时维护与生态退役
  blocks_through: P2
  exit: containerd 维护期、Ingress NGINX 官方来源冲突和必要替换独立决策。
- id: GAP-07
  name: 产品升级准入与顺序
  blocks_through: P4
  exit: 证明跳 minor/降级拒绝、混合阶段偏差、逐节点 drain/PDB 和失败续跑。
- id: GAP-08
  name: 供应链范围与完整性
  blocks_through: P5
  exit: Kubernetes目标六二进制的精确构建/官方内容/双端双架构已完成；其余实际消费制品按复用/变化集合继续准入，不重复已合格批次。
- id: GAP-09
  name: 证据复用及矩阵映射
  blocks_through: P3
  exit: 正式副本已归档并映射；逐主张核对增量、必要原始归档与目标适用性，只冻结剩余最小补证及成本上界。
- id: GAP-10
  name: 独立升级执行入口
  blocks_through: P4
  exit: 新增专用 validator/runner/合同留在 upgrade；先证明真实 handoff、收证和前置拒绝。
- id: GAP-11
  name: 恢复与资源计划
  blocks_through: P3
  exit: 明确各不可逆点/数据窗口、精确恢复出口、主机租约和清理边界，现场前验证。
- id: GAP-12
  name: 发布身份与打包
  blocks_through: P8
  exit: 核验 root tag workflow/build.py 的 tools 副作用及升级目录是否需要随产品交付。
