gaps:
- id: GAP-01
  name: 客户源身份关联（不重开GA）
  blocks_through: P0
  exit: 已接受源全功能GA；关联精确tag/制品/配置用于目标复用，只阻断缺失身份所涉及的主张。
- id: GAP-02
  name: 完整依赖盘点
  blocks_through: P1
  exit: 展开 Chart/模板/fixture 隐式 pin 和每项用途，消除库存与实际消费的混淆。
- id: GAP-03
  name: 官方目录与组合
  blocks_through: P2
  exit: 补齐四类资料目录、已知问题、维护期及准确支持范围；逐组件冻结目标和桥接。
- id: GAP-04
  name: 源 patch 桥接
  blocks_through: P2
  exit: 决定是否确需 1.33.13；官方推荐与强制要求区分并记录依据。
- id: GAP-05
  name: Calico 过渡
  blocks_through: P2
  exit: 找到官方覆盖源/目标的稳定组合及升级链，保持本项目 etcdv3 路径。
- id: GAP-06
  name: 运行时维护与生态退役
  blocks_through: P2
  exit: containerd 维护期、Ingress NGINX 官方来源冲突和必要替换独立决策。
- id: GAP-07
  name: 产品升级准入与顺序
  blocks_through: P4
  exit: 证明跳 minor/降级拒绝、混合阶段偏差、逐节点 drain/PDB 和失败续跑。
- id: GAP-08
  name: 供应链范围与完整性
  blocks_through: P5
  exit: 精确选择 k8s-bin 构建，官方下载校验/原子落盘，双端双架构回读，拒绝范围越界。
- id: GAP-09
  name: 证据复用及矩阵映射
  blocks_through: P3
  exit: 正式副本已归档并映射；逐主张核对增量、必要原始归档与目标适用性，只冻结剩余最小补证及成本上界。
- id: GAP-10
  name: 独立升级执行入口
  blocks_through: P4
  exit: 新增专用 validator/runner/合同留在 upgrade；先证明真实 handoff、收证和前置拒绝。
- id: GAP-11
  name: 恢复与资源计划
  blocks_through: P3
  exit: 明确各不可逆点/数据窗口、精确恢复出口、主机租约和清理边界，现场前验证。
- id: GAP-12
  name: 发布身份与打包
  blocks_through: P8
  exit: 核验 root tag workflow/build.py 的 tools 副作用及升级目录是否需要随产品交付。
