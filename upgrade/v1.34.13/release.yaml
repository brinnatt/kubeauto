current_upgrade_contract:
  production_entry: config.yml + kubecli upgrade
  source_paths:
  - playbooks/93.upgrade.yml
  - roles/kube-master/tasks/main.yml
  - roles/kube-node/tasks/main.yml
  existing_gate: tests/helpers/delivery-upgrade-smoke.sh
  existing_contract: tests/unit/test_upgrade_gate.py
  proven_gate_scope: v1.33.5 到 v1.33.6 的单节点 Docker 补丁迁移；此处未重新核验旧现场证据
  design_gaps:
  - 当前 playbook 只显式拒绝相同版本，未提供完整 minor/降级/组合准入。
  - 按单台 master 组合执行控制面和节点角色，需证明全部实际可达 API 的偏差与组件顺序。
  - worker 更新无显式滚动批次，节点升级路径没有 drain/PDB 流程。
  - 旧门禁不能证明 HA 跨 minor、持续业务、受控疏散和中断续跑。
  classification: 新升级能力的准入缺口；未复现并认定现有稳定基线存在生产故障
