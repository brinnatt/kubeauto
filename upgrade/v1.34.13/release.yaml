    checked_on: '2026-11-14'
    scope: 本轮升级方案文件的内容、引用一致性与两类维护者阅读路径；不是完整官方研究或产品验收
    requirements:
    - requirement: 首次维护者能够按顺序进入第一跳
      location: upgrade/README.md + upgrade/workflow.md 第1至7节
      finding: 入口、阶段输入/出口、停止与恢复边界明确；未知客户基线和目标pin分别保留GAP，未给虚假现场命令
    - requirement: 熟练维护者能够定位选型、复用和异常处置
      location: upgrade/policy.md + upgrade/acceptance.md + upgrade/v1.34.13/acceptance-plan.yaml
      finding: 官方证据力度、迁移边、最小影响、原矩阵映射、失败分类和最终范围分别有主要归属
    - requirement: 新文件独立且不改签原交付
      location: upgrade/AGENTS.md + upgrade/data-contract.md + upgrade/v1.33.6/release.yaml
      finding: 新资产集中upgrade；根AGENTS仅导航；源码观察与客户基线分开，旧代码/门禁/证据不迁移
    - requirement: 版本与证据结论不超出已核实事实
      location: upgrade/official-sources.yaml + upgrade/v1.34.13/research.yaml
      finding: 保留观察日期、已读范围、来源冲突和未读目录；所有目标组件决策待查，未宣称全矩阵兼容
    - requirement: 数据可追溯且无虚构PASS
      location: upgrade/catalog.yaml + upgrade/v1.33.6/inventory.yaml + upgrade/v1.34.13/test-matrix.yaml
      finding: 组件引用/原矩阵ID/依赖顺序/源码与Dockerfile摘要可本地核对；正式项全部pending，执行入口为空
    - requirement: 已GA基线继承、实际复制与回归成本边界
      location: upgrade/acceptance.md 第1–6节、源evidence-manifest与目标acceptance-plan
      finding: 修正只引用不复制、全部路径现场化和源身份未知等同未GA的问题；实际归档143份文件，目标适用性与原始归档核验仍未冒签完成
    local_checks:
    - YAML解析及重复key检查
    - 30组件域决策/研究/影响映射全覆盖，28镜像组均有归属
    - 15父项唯一ID、原矩阵ID存在、依赖无环和最终项全部前置引用
    - 快照源码与178条外部镜像Dockerfile SHA256核对
    - Markdown本地链接/锚点、代码块与新旧文件空白检查
    limitations:
    - 没有升级专用正式validator或现场执行，静态检查不能解锁产品PASS
    - 官方四类目录增量、目标组合和必要身份关联仍待完成；不撤销源GA，不自动扩大现场范围
    - 无非作者评审、用户文件批准或客户签收主张
