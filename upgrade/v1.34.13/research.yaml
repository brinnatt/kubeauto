schema_version: 1
recorded_on: '2026-11-14'
quality_standard: docs/documentation-quality-standard.md 第1/10/11节
known_official_observations: upgrade/official-sources.yaml
scope: 第一跳全组件域研究基线；按真实依赖边界展开，不递归审计厂商全部产品
completion_claim: false
directory_item_contract:
  required:
  - official_category
  - original_topic
  - version_or_commit
  - url
  - observed_on
  - status
  - mechanism_and_constraints
  - project_mapping
  - document_destination
  - exclusion_basis
  - acceptance_refs
  statuses:
  - pending
  - understood
  - excluded
  - unavailable
  rule: 四类目录分别完整处理；已读专题不等于全目录完成。排除有依据，重复项保留到同结论的映射。
topics:
- id: R-01
  topic: 官方四类资料完整目录与增量
  task: 按组件/版本盘点官方用户、运维、技术、开发等价入口；复用已有完整基线，补目录差异和缺项。
  output: 每个目录项的版本/URL、阅读或排除依据、机制约束、项目/正文去向
- id: R-02
  topic: Kubernetes 目标发布差异
  task: 固定 1.33.6/可选源 patch 与 1.34.13 的 release notes、弃用/移除、feature gate/flags/default、已知问题与安全公告。
  output: 对应到 API/模板/配置/命令、UPG 父项和最小反证；无依据不修实现
- id: R-03
  topic: 组件支持窗口与配套
  task: 逐 pin 判断 tested/supported/minimum/API/source-pin，核对维护期、许可、Chart/appVersion、Operator/CRD/引擎/sidecar/客户端。
  output: 目标与过渡版本的约束交集；没有官方矩阵则保留实际依据和关键缺口
- id: R-04
  topic: 主机与运行时约束
  task: 核对内核/cgroup/CRI/RuntimeConfig、runc/CNI、目标架构、动态库及客户容量，不沿用旧环境资格代替新要求。
  output: 保持/变化的环境要求及实际影响；不任意扩大 OS 全量回归
- id: R-05
  topic: 升级与恢复语义
  task: 核对源/目标/桥接、HA偏差、drain/PDB/卷、CRD存储与转换、etcd/数据格式、备份恢复、不可逆点。
  output: 每条迁移边、停止/重入/恢复条件与数据窗口
- id: R-06
  topic: 自有补丁与共享依赖
  task: 检查 Redis/Longhorn/ES 等 -kubeauto 镜像修复是否已被上游接收，保持修复语义；核验 ECK/快照/监控共享所有权。
  output: 补丁账和各消费者影响；拒绝以未修订官方镜像静默替换
