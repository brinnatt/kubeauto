retrieval_gaps:
- source: raw.githubusercontent.com 多个官方源码链接
  state: 部分握手/读超时或断开；已从官方网页/GitHub固定tag取得的结论见官方来源表，未取得全文继续待查
- source: docs.cilium.io/en/v1.19/network/kubernetes/compatibility/
  state: 403；已用固定 v1.19.5 官方源码文档取得兼容表，不将该替代等同完整文档阅读
- source: longhorn.io/docs/1.12.1/deploy/important-notes/
  state: 404；按现有矩阵给出的 /important-notes/ 入口后续核对，未读不签完成
next_exit: P1/P2：逐组件关联已有研究基线，补四类目录/增量，关闭目标组合与过渡路径的关键约束
incremental_research_policy:
  baseline_ga: 已确认，不重新研究以证明旧GA
  first_read: 先定位已有手册/矩阵官方记录，保留旧结论和目录映射；缺项如实补齐
  delta: 按目标版本目录、发布说明/已知问题与实际接口差异增量处理；同一结论只研究一次
  gaps: 研究/访问缺口不等于现场测试任务；只阻断依赖该结论的组合
  reading_cost: 定点读取目录差异与涉及的官方主题，摘要未变的记录不重复全文读取
