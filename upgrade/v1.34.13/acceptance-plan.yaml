  authority: AGENTS.md Fixed lab authority
  hosts: []
  leases: []
  capacity_budgets: []
  disk_allowlists: []
  port_ownership: []
  parallel_branches: []
  conflicts: []
  cleanup_scope: null
final_run:
  parent_id: UPG-15
  frozen: false
  steps: []
  launcher: null
  refusal_contract: null
  run_id: null
  prerequisite_rule: 除UPG-15外全部适用父项当前完整证据，通过真实launcher变更前校验；缺失/pending/fail/过期拒绝。
  clean_setup: true
  clean_verify_marker: LAB_CLEAN_VERIFY_PASS
  historical_deep_cases: 只有逐依赖核验后的原证据作为前置；不冒称本轮重跑
  coverage_methods: 适用旧证据+官方依据+静态合同作为前置；最终只实际执行冻结的迁移、新建主路径和受影响整合
  no_repeated_full_components: true
completion_conditions:
- 全部组件映射展开到实际具体依赖/原ID，复用与补测有可审核依据
- 所有原强制完整项均有明确处置，不以本矩阵静默替换
- 支持路径组合/等价依据、主机租约、容量、精确入口/超时/清理冻结
- 逐次构建和发布计划在允许集合内，不借模式名扩大范围
baseline_policy:
  source_ga: upgrade/v1.33.6/release.yaml#accepted_ga_baseline
  reopen_source_ga: false
  default: 保留已接受功能断言的证据，先做官方兼容与版本差异判断；investigate不表示重测
  manifest: upgrade/v1.33.6/evidence-manifest.yaml
  copy_rule: 目标reuse_evidence仅指向upgrade内副本，复制完整性不等于目标适用性通过
scope_control:
  coverage_rule: 全部承诺路径须有证据去向，不要求本轮全部现场执行
  new_live_step_fields:
  - parent_ids
  - claim
  - changed_dependency_or_new_claim_gap
  - prior_evidence_considered
  - why_not_reusable
  - smallest_disproof
  - shared_setup
  - time_and_resource_bound
  - success_exit
  - failure_exit
  - cleanup
  deferred: 没有明确差异/新主张缺口时，不加入历史故障/PITR/DR/性能/长稳场景
  deduplication: 同次真实步骤按断言支持多个父项，不为不同marker重复执行
  scope_changes: []
  expansion_rule: 扩大已冻结范围先列ID/依据/不可复用原因和增量成本；超出本次授权或预算时不启动增量
cost_control:
  state: planning-only
  user_context: 用户表示三天测试约700元且不可承担长期重复回归；这不是已授权预算
  authorized_live_budget: null
  max_agent_work_budget: null
  max_live_wall_clock: null
  max_environment_occupancy: null
  billing_telemetry: 未取得真实token/费用计量，不从时长换算费用或承诺节省比例
  live_launch_enabled: false
  launch_condition: 实现范围、最小步骤、成本上界和所需合同均冻结并在授权内，才允许现场
  monitoring: 优先持久runner心跳与阶段摘要，异常定点诊断；不反复全量读日志
  overrun_action: 停止启动未授权增量，保留首失败并完成安全恢复/清理
